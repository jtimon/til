          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-riscv32 test/nng_pair.til
          qemu-riscv32 -L "$("$RISCV32_CC" -print-sysroot)" bin/nng_pair_linux-riscv32 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree (with the
      # Bootlin compiler and binutils) into vendor/libffi/build-linux-riscv32;
      # test/ffi_prep.til calls it directly. (til itself does not build for
      # a 32-bit target, so no interpreter run here.)
      - name: Cross-compile and run a libffi program for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" vendor/libffi/build-linux-riscv32/.libs/libffi.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/ffi_prep_riscv32 test/ffi_prep.til
          SYSROOT=$("$RISCV32_CC" -print-sysroot)
          qemu-riscv32 -L "$SYSROOT" bin/ffi_prep_riscv32 | grep -q "ffi_prep ok"
      # Issue #232: riscv32 GUI, same shape as the arm32 gui step. No
      # distro ships a riscv32 gcc, so the raylib/tinyfd recipes take the
      # Bootlin compiler as RISCV32_CC. Build + file check only (no
      # riscv32 X11 userspace exists to run against; the 32-bit gui
      # runtime path is covered by the linux-x86 qemu smoke).
      - name: Cross-compile a GUI example for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" \
            vendor/raylib/build-linux-riscv32/libraylib.a vendor/tinyfiledialogs/build-linux-riscv32/libtinyfd.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/hello_gui_riscv32 examples/hello_gui.til
          file bin/hello_gui_riscv32 | grep -q "RISC-V"

  # Issue #424: wasm32 through the vendored emsdk. A non-gui program is a
  # single .js (wasm embedded) run under node; a mode gui program is a
  # single .html page. make installs the emsdk on the way to the wasm32
  # libsecp256k1 archive, so test/crypto.til -- the SHA-256 and BIP-340
  # vectors -- runs here as wasm too.
  wasm32:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: wasm32 (emscripten, run under node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Build bin/til (native)
        run: make
      - name: Install the vendored emsdk and the wasm32 libsecp256k1
        run: make vendor/secp256k1/build-wasm32/lib/libsecp256k1.a vendor/raylib/build-wasm32/libraylib.a
      - name: Record the C toolchain
        run: |
          export EM_CONFIG=$PWD/vendor/emscripten/.emscripten
          for tool in gcc "$PWD/vendor/emscripten/upstream/emscripten/emcc"; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run wasm32 programs
        run: |
          export EM_CONFIG=$PWD/vendor/emscripten/.emscripten
          EMCC=$PWD/vendor/emscripten/upstream/emscripten/emcc
          NODE=$(ls vendor/emscripten/node/*/bin/node | head -1)
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/hello_script.js examples/hello_script.til
          "$NODE" bin/hello_script.js | grep -q "Hello World"
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/crypto.js test/crypto.til
          "$NODE" bin/crypto.js
          # Issue #472 (F1a): the layout corpus; see the linux-arm64 job.
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/layout_corpus.js test/layout_corpus.til
          "$NODE" bin/layout_corpus.js | grep -q "layout corpus OK"
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/hello_gui.html examples/hello_gui.til
          grep -qi "<html" bin/hello_gui.html
      # Switched off (if: false) in the three jobs that have these two
      # steps: not a priority until the rest of #472 is done (Jorge,
      # 2026-11-20). The one run they had (3186) is in issues/open/473.org.
      # Issue #473: wasm32 from three hosts, on trial -- this one, the
      # arm64 Linux host and the arm64 Mac, each with the vendored emsdk at
      # its pinned version (the emsdk installs that host's build of one
      # emscripten release). Two programs at both widths; the list is the
      # .js emcc writes, with the module inside.
      - name: Write the wasm32 binary hash list
        if: false
        continue-on-error: true
        run: |
          mkdir -p tmp/hashes-binary-wasm
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary-trial linux-x64 tmp/hashes-binary-wasm/linux-x64.txt bin/til wasm32
          cat tmp/hashes-binary-wasm/linux-x64.txt
      - name: Upload the wasm32 binary hash list
        if: false
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-wasm-linux-x64
          path: tmp/hashes-binary-wasm/linux-x64.txt

  windows-x64-build:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: windows-x64/x86 (cross-compile on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      # Issue #483: the pinned llvm-mingw (make.til LLVM_MINGW_RELEASE and
      # _LAYOUT) builds everything for the windows targets, on every host:
      # its bin goes first on PATH before anything is built. It carries the
      # x86_64-w64-mingw32-gcc, -ar, -windres and -dlltool names til and
      # bin/make run, as clang and the llvm tools. `make llvm_mingw` unpacks
      # it into vendor/llvm-mingw, kept between runs: one cache entry per
      # release and runner kind.
      - name: The pinned llvm-mingw release
        id: llvm-mingw
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          echo "release=$release-$layout" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: The pinned llvm-mingw first on PATH
        run: |
          make llvm_mingw
          echo "$PWD/vendor/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Record the C toolchain
        run: |
          for tool in gcc x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc x86_64-w64-mingw32-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for windows-x64 and windows-x86
        run: |
          ./bin/til build --target=windows-x64 -o bin/hello_script.exe examples/hello_script.til
          file bin/hello_script.exe | grep -q "PE32+"
          # windows-x86 (32-bit, mingw i686) -- issue #232
          ./bin/til build --target=windows-x86 -o bin/hello_script-x86.exe examples/hello_script.til
          file bin/hello_script-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #472 (L3a): the driver of the suite's reproducible_build row,
      # for the two windows targets. mingw's ld wrote the link time into
      # every PE; til now links them with --no-insert-timestamp. A program
      # and a library, from two checkout roots and at two times, compared
      # byte for byte.
      - name: Build for windows-x64 and windows-x86 reproducibly
        run: |
          ./bin/til run test/reproducible_build.til bin/til windows-x64
          ./bin/til run test/reproducible_build.til bin/til windows-x86
      # Issue #472 (F1a): see the linux-arm64 job. Build only: the asserts
      # are checked by the compiler, and this file is not in the artifact
      # the windows runner executes.
      - name: Build the layout corpus for windows-x64 and windows-x86
        run: |
          for width in 32 64; do
            ./bin/til build --target=windows-x64 --usize=$width -o bin/layout_corpus.exe test/layout_corpus.til
            ./bin/til build --target=windows-x86 --usize=$width -o bin/layout_corpus-x86.exe test/layout_corpus.til
          done
      # Issue #232: prove mode gui cross-links for BOTH windows arches. mingw
      # ships the win32/win64 GL/GDI backend, so raylib/tinyfd cross-build
      # from source with no X11 sysroot. Build-only (a raylib window cannot
      # open on a headless runner) -- the file-format check is the proof, the
      # same shape as the mac gui-cross job.
      - name: Cross-compile a GUI example for windows-x64 and windows-x86
        run: |
          make vendor/raylib/build-windows-x64/libraylib.a vendor/tinyfiledialogs/build-windows-x64/libtinyfd.a
          make vendor/raylib/build-windows-x86/libraylib.a vendor/tinyfiledialogs/build-windows-x86/libtinyfd.a
          ./bin/til build --target=windows-x64 -o bin/hello_gui.exe examples/hello_gui.til
          file bin/hello_gui.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/hello_gui-x86.exe examples/hello_gui.til
          file bin/hello_gui-x86.exe | grep -q -E "Intel (80386|i386)"
          # The retained editor example covers a larger GUI app than the smoke
          # example. Full editor development now lives in jtimon/tiled.
          ./bin/til build --target=windows-x64 -o bin/editor.exe examples/editor.til
          file bin/editor.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/editor-x86.exe examples/editor.til
          file bin/editor-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #235: std/crypto on windows. libsecp256k1 cross-builds from
      # the vendored source for both arches (mingw is the whole toolchain
      # change; no shims, unlike nng), and test/crypto.til -- the FIPS
      # 180-4 SHA-256 and BIP-340 vectors through the std wrapper -- links
      # against those archives and RUNS on the windows runner below.
      - name: Cross-compile the std/crypto test for windows-x64 and windows-x86
        run: |
          make vendor/secp256k1/build-windows-x64/lib/libsecp256k1.a vendor/secp256k1/build-windows-x86/lib/libsecp256k1.a
          ./bin/til build --target=windows-x64 -o bin/crypto.exe test/crypto.til
          file bin/crypto.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/crypto-x86.exe test/crypto.til
          file bin/crypto-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #420: both mingw libffi archives, called directly by
      # test/ffi_prep.til (the win64 one is otherwise only exercised through
      # til.exe's interpreter, the win32 one not at all); the programs run
      # on the windows runner below.
      - name: Cross-compile the libffi test for windows-x64 and windows-x86
        run: |
          make vendor/libffi/build-windows-x64/.libs/libffi.a vendor/libffi/build-windows-x86/.libs/libffi.a
          ./bin/til build --target=windows-x64 -o bin/ffi_prep.exe test/ffi_prep.til
          file bin/ffi_prep.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/ffi_prep-x86.exe test/ffi_prep.til
          file bin/ffi_prep-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #422: nng for both windows arches, from make.til's per-target
      # table; test/nng_pair.til (a one-process round trip over inproc://)
      # runs on the windows runner below.
      - name: Cross-compile the nng test for windows-x64 and windows-x86
        run: |
          make vendor/nng/build-windows-x64/libnng.a vendor/nng/build-windows-x86/libnng.a
          ./bin/til build --target=windows-x64 --extra-modes=examples/custom_modes.til -o bin/nng_pair.exe test/nng_pair.til
          file bin/nng_pair.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 --extra-modes=examples/custom_modes.til -o bin/nng_pair-x86.exe test/nng_pair.til
          file bin/nng_pair-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #473 (C1): every file of the upload below, by name. The upload
      # action accepts a list with a member missing, and the runner would
      # then test a partial set. Keep this list and the upload's the same.
      - name: Check the .exe artifact is complete
        run: |
          status=0
          for f in hello_script crypto ffi_prep nng_pair; do
            for e in "$f.exe" "$f-x86.exe"; do
              if [ ! -f "bin/$e" ] || [ ! -s "bin/$e" ]; then
                echo "missing or empty: bin/$e"; status=1
              fi
            done
          done
          exit $status
      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_script-windows
          if-no-files-found: error
          path: |
            bin/hello_script.exe
            bin/hello_script-x86.exe
            bin/crypto.exe
            bin/crypto-x86.exe
            bin/ffi_prep.exe
            bin/ffi_prep-x86.exe
            bin/nng_pair.exe
            bin/nng_pair-x86.exe
      # Issue #472: this host's windows-x64 binary hash list, with the
      # pinned llvm-mingw every windows step of this job uses (see the top
      # of the job). Strict: see the linux-arm64-native job's step.
      - name: Write the windows binary hash list with the pinned llvm-mingw
        run: |
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc --version | grep -q clang
          # Run 3130: til.exe's code was the same from all three hosts, but
          # every C object of libffi and nng differed between each pair of
          # them. One small object in full, to read what differs from the
          # three logs.
          mkdir -p tmp/probe
          (cd tmp/probe && x86_64-w64-mingw32-ar x ../../vendor/libffi/build-windows-x64/.libs/libffi.a types.o)
          x86_64-w64-mingw32-objdump -h -t -s tmp/probe/types.o
          mkdir -p tmp/hashes-binary-windows
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-x64 tmp/hashes-binary-windows/linux-x64.txt bin/til windows-x64
          # Run 3138: the two Linux hosts write the same til.exe and the
          # Windows host another one, with the same vendored objects. til's
          # lines by section, and the strings in the two debug sections that
          # differ (run 3138: .debug_info and .debug_line), to read from the
          # three logs what differs.
          grep "src/til.til til" tmp/hashes-binary-windows/linux-x64.txt
          x86_64-w64-mingw32-objcopy --dump-section .debug_line=tmp/probe/debug_line --dump-section .debug_info=tmp/probe/debug_info tmp/ci_collect/binary_windows-x64/til.exe tmp/probe/til_copy.exe
          x86_64-w64-mingw32-strings -a tmp/probe/debug_line | grep -E '[/\\]|\.[ch]$' | sort -u | head -80
          x86_64-w64-mingw32-strings -a tmp/probe/debug_info | grep -E '[/\\]|\.[ch]$' | sort -u | head -20
      - name: Upload the windows binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-windows-linux-x64
          path: tmp/hashes-binary-windows/linux-x64.txt
      # Issue #472: the mac targets with the one compiler every host uses
      # for them, LLVM's own release (clang, lld, dsymutil, the llvm tools)
      # at one pinned version, published for Linux x64 and arm64 and macOS
      # arm64 hosts. `make llvm` downloads it, checks its sha256 and unpacks
      # only the tools til and bin/make run; they go first on PATH. Headers and libSystem are vendor/macos, as
      # before. Mac equality remains on trial; Android producer failures are
      # blocking after run 3167. The mac binaries the Macs RUN are built by
      # macos-cross-build with Ubuntu's clang.
      # The pinned LLVM (make.til LLVM_RELEASE), unpacked by `make llvm` into
      # vendor/llvm, kept between runs: one cache entry per release and
      # runner kind.
      - name: The pinned LLVM release
        id: llvm
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_RELEASE := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned LLVM
        uses: actions/cache@v4
        with:
          path: vendor/llvm
          key: llvm-${{ steps.llvm.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Write the mac and Android binary hash lists with the pinned LLVM
        run: |
          make llvm
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version
          clang --version | grep -q "clang version 23.1.5"
          ld64.lld --version
          rm -rf vendor/libffi/build-macos-arm64 vendor/libffi/build-macos-x64 vendor/nng/build-macos-arm64 vendor/nng/build-macos-x64
          make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/libffi/build-macos-x64/.libs/libffi.a
          make vendor/nng/build-macos-arm64/libnng.a vendor/nng/build-macos-x64/libnng.a
          # SDK-capable x64 producer: local checks compare signed APKs with
          # one debug key; the collector hashes the aligned unsigned payload.
          export TMPDIR="$PWD/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$PWD/tmp"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"
          make vendor/raylib/build-android-x64/libraylib.a vendor/raylib/build-android-arm64/libraylib.a
          ./bin/til run test/reproducible_build.til bin/til android-x64
          ./bin/til run test/reproducible_build.til bin/til android-arm64
          mkdir -p tmp/hashes-binary-mac
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-x64 tmp/hashes-binary-mac/linux-x64.txt bin/til macos-arm64 macos-x64 android-x64 android-arm64
      - name: Upload the mac binary hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-mac-linux-x64
          path: tmp/hashes-binary-mac/linux-x64.txt
          if-no-files-found: error
      # Issue #504: the six Linux targets with their pinned C library --
      # Bootlin's toolchain for each, glibc 2.34, unpacked by bin/make under
      # vendor/linux -- and the pinned LLVM that is first on PATH here. til
      # builds a linux target with clang, lld and that tree wherever it is
      # unpacked, and bin/make builds the target's archives the same way,
      # this host's own included. So this host's own bin/til is built again
      # here, against the tree (bin/make vendor swaps the host's archives,
      # bin/til depends on them): the list's "make bin/til" for this host's
      # target is then that file, to compare with the other host's cross
      # build of it. Run 3199: the two hosts' linux-x64 and linux-arm64
      # lists were equal but for that item, each host's own gcc build then.
      # The 32-bit targets list no til: til is not a 32-bit program. On
      # trial and continue-on-error.
      - name: Write the linux binary hash lists with the pinned C library
        continue-on-error: true
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version | grep -q "clang version 23.1.5"
          ./bin/make linux_sysroots
          ./bin/make vendor
          ./bin/make bin/til
          sha256sum bin/til
          for target in linux-x64 linux-arm64 linux-arm32 linux-riscv64 linux-x86 linux-riscv32; do
            ./bin/make vendor/libffi/build-$target/.libs/libffi.a vendor/nng/build-$target/libnng.a
            ./bin/til run test/reproducible_build.til bin/til $target
          done
          mkdir -p tmp/hashes-binary
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-x64 tmp/hashes-binary/linux-x64.txt bin/til linux-x64 linux-arm64 linux-arm32 linux-riscv64 linux-x86 linux-riscv32
      - name: Upload the linux binary hash lists
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-linux-x64
          path: tmp/hashes-binary/linux-x64.txt

  windows-x64-run:
    name: windows-x64/x86 (run .exe on windows)
    needs: windows-x64-build
    runs-on: windows-latest
    steps:
      - name: Download .exe artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello_script-windows
      # Issue #473 (C1): the eight files windows-x64-build uploads, before
      # any of them runs.
      - name: Check the downloaded .exe artifact is complete
        shell: bash
        run: |
          status=0
          for f in hello_script crypto ffi_prep nng_pair; do
            for e in "$f.exe" "$f-x86.exe"; do
              if [ ! -f "$e" ] || [ ! -s "$e" ]; then
                echo "missing or empty: $e"; status=1
              fi
            done
          done
          exit $status
      - name: Run .exe (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./hello_script.exe
          ./hello_script.exe | grep -q "Hello World"
          ./hello_script-x86.exe
          ./hello_script-x86.exe | grep -q "Hello World"
      # Issue #235: a failing vector panics and exits nonzero, which fails
      # the step; the pass lines are in the log for reading.
      - name: Run the std/crypto test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./crypto.exe
          ./crypto-x86.exe
      - name: Run the libffi test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./ffi_prep.exe | grep -q "ffi_prep ok"
          ./ffi_prep-x86.exe | grep -q "ffi_prep ok"
      - name: Run the nng test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./nng_pair.exe | grep -q "nng pair ok"
          ./nng_pair-x86.exe | grep -q "nng pair ok"

  # Issue #25: til itself running on a windows HOST. bin/til.exe is the
  # compiler cross-built for windows (build_win_host) on linux, then run
  # on a real windows runner: `til.exe interpret` and `til.exe translate`
  # prove the interpreter and codegen run natively on windows -- neither
  # needs a C toolchain, and the win64 libffi is statically linked so
  # ext_func dispatch works. sender.exe is the nng mode-server example,
  # cross-built against the win64 nng; running it
  # here proves nng works on real winsock -- wine's winsock is incomplete
  # and cannot, so this job IS the nng-on-windows proof.
  # Issue #483: make and make install natively on Windows, from the
  # repository alone -- no compiler or library imported from another host.
  # The runner's MSYS2 (C:\msys64) supplies make, sh, coreutils and, from
  # pacman, cmake and GNU make (mingw32-make, the name make.til uses on
  # Windows, where a bare `make` would find bin/make.exe itself);
  # MSYSTEM=UCRT64 and CHERE_INVOKING keep the checkout as the directory.
  # The compiler is the pinned llvm-mingw, as for the windows targets on
  # every host (README.org, "Windows host"): its bin goes first on PATH in
  # every step that builds, and its clang is the suite's too. MSYS2's gcc
  # only builds the bootstrap bin/make that downloads it, when the cache
  # has none; that bootstrap is removed before anything is built with
  # llvm-mingw. The runner's user is an administrator, so the default
  # prefix (C:/Program Files/til) is writable.
  windows-x64-native:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: windows-x64 native (make, make install)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
      # Mesa's CPU renderer, the one the linux jobs draw with. Left to
      # choose, Mesa took its D3D12 driver over Microsoft's software
      # D3D12, and every GUI test that drew a frame died with exit 87 or
      # never ended (CI run 3136; the ones that drew nothing passed).
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v5
      - name: Install make, cmake and the bootstrap gcc into MSYS2
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake && uname -s && gcc --version"
      # The pinned llvm-mingw (make.til LLVM_MINGW_RELEASE and _LAYOUT), unpacked by
      # `make llvm_mingw` into vendor/llvm-mingw, kept between runs: one
      # cache entry per release and runner kind.
      - name: The pinned llvm-mingw release
        id: llvm-mingw
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          echo "release=$release-$layout" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download the pinned llvm-mingw with a bootstrap bin/make
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "make llvm_mingw && rm -rf bin tmp/boot vendor/libffi/build-windows-x64"
      - name: make
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "export PATH=$PWD/vendor/llvm-mingw/bin:$PATH && gcc --version && make"
      - name: make install
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "export PATH=$PWD/vendor/llvm-mingw/bin:$PATH && make install"
      # The installed compiler, from a directory outside the checkout: it
      # finds its support tree through its own location.
      - name: The installed til builds and runs a program elsewhere
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "export PATH=$PWD/vendor/llvm-mingw/bin:$PATH && mkdir -p ../elsewhere && cp examples/hello_script.til ../elsewhere/ && cd ../elsewhere && '/c/Program Files/til/bin/til.exe' interpret hello_script.til && '/c/Program Files/til/bin/til.exe' run hello_script.til | grep -q 'Hello World'"
      # The runner has no GPU, so no OpenGL driver: raylib's OpenGL 3.3
      # build stops at "WGL: The driver does not appear to support OpenGL"
      # (CI run 3129). The linux jobs get a software OpenGL from Mesa
      # (libgl1-mesa-dri); this is the same for Windows: MSYS2's Mesa,
      # registered as the OpenGL driver Windows' opengl32.dll loads. The
      # binaries are the ones users get; only the machine's driver differs.
      - name: Software OpenGL for the GUI tests (Mesa)
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa && ls /ucrt64/bin | grep -i -E 'gallium|opengl'"
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" /v DLL /t REG_SZ /d C:\msys64\ucrt64\bin\libgallium_wgl.dll /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" /v DriverVersion /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" /v Flags /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" /v Version /t REG_DWORD /d 2 /f
      # The whole suite, as linux-x64 runs it (without ASAN: MinGW has
      # none), its JVM checks included: the runner's JDK 17 by name, since
      # the binding compiles at --release 8, which JDK 8 has no option for.
      - name: make test
        shell: cmd
        timeout-minutes: 75
        run: C:\msys64\usr\bin\bash.exe -lc "export PATH=$PWD/vendor/llvm-mingw/bin:$PATH && export JAVA_HOME=$JAVA_HOME_17_X64 && make test"
      # Issue #472 (F4): generated source is compared between hosts, so the
      # Windows compiler has to bake file names the way the others do:
      # ./src/... for the compiler's own tree, the path as written for the
      # program, forward slashes, never a drive or an absolute path. The
      # grep -o lines show what was baked before anything is judged.
      - name: Check the source paths til.exe bakes
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          ./bin/til.exe translate -c tmp/f4_copy_file.c test/copy_file.til
          grep -o '"[^"]*\.til:[0-9]*:[0-9]*' tmp/f4_copy_file.c | sed 's/:[0-9]*:[0-9]*$//' | sort | uniq -c
          grep -q '"\./src/core/[a-z_]*\.til:' tmp/f4_copy_file.c
          grep -q '"\./src/std/[a-z_]*\.til:' tmp/f4_copy_file.c
          grep -q '"test/copy_file\.til:' tmp/f4_copy_file.c
          if grep -E '"([A-Za-z]:|/)[^"]*\.til:[0-9]' tmp/f4_copy_file.c; then
            echo "an absolute source path is baked into the generated C"; exit 1
          fi
          if grep -F '\\' tmp/f4_copy_file.c | grep -E '\.til:[0-9]'; then
            echo "a backslash source path is baked into the generated C"; exit 1
          fi
      # nng over a real winsock: the suite's nng checks use inproc://.
      # sender listens on tcp://127.0.0.1:5555 and sends one message, then
      # closes; receiver dials, receives (3s recv-timeout so it can never
      # hang), and prints it. sender's nng_send blocks until a peer takes the
      # message, so sender runs in the background and receiver drives the
      # exchange; a sender still blocked afterwards is reaped, not awaited.
      - name: Run nng sender+receiver over real winsock
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm-mingw/bin:$PATH"
          for name in sender receiver; do
            ./bin/til.exe build --extra-modes=examples/custom_modes.til -o bin/$name.exe examples/$name.til
          done
          ./bin/sender.exe > tmp/sender.out 2>&1 &
          spid=$!
          sleep 3
          ./bin/receiver.exe | tee tmp/receiver.out
          kill "$spid" 2>/dev/null || true
          wait "$spid" 2>/dev/null || true
          echo "--- sender output ---"; cat tmp/sender.out
          grep -q "nng version" tmp/receiver.out
          grep -q "received: hello from til over nng" tmp/receiver.out
      # Issue #473 (C3): this host's hash list for the collect job, from the
      # til.exe the suite tested. The collector is built, not interpreted
      # (interpreting it takes hours). A Windows process ends the lines it
      # prints with CR LF; the collector reads observations as text.
      - name: Write the hash lists for the collector
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm-mingw/bin:$PATH"
          mkdir -p tmp/hashes
          ./bin/til.exe build -o tmp/ci_collect.exe -c tmp/ci_collect.c examples/ci_collect.til
          ./tmp/ci_collect.exe produce windows-x64 tmp/hashes/windows-x64.txt bin/til.exe
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-windows-x64
          path: tmp/hashes/windows-x64.txt
          if-no-files-found: error
      # Issue #472: this host's own windows-x64 build -- til.exe, two
      # programs, a library, the vendored archives -- with the pinned
      # llvm-mingw, the third producer beside the two Linux hosts' cross
      # builds (see the windows-x64-build job), which it has to equal.
      # bin/til.exe only drives the build: what it builds must not depend
      # on what built it. Strict since CI runs 3159 to 3166 showed this
      # host's files equal to theirs, its tested bin/til.exe included.
      - name: Write the windows binary hash list with the pinned llvm-mingw
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm-mingw/bin:$PATH"
          gcc --version
          gcc --version | grep -q clang
          x86_64-w64-mingw32-gcc --version | grep -q clang
          # Run 3130: til.exe's code was the same from all three hosts, but
          # every C object of libffi and nng differed between each pair of
          # them. One small object in full, to read what differs from the
          # three logs.
          mkdir -p tmp/probe
          (cd tmp/probe && x86_64-w64-mingw32-ar x ../../vendor/libffi/build-windows-x64/.libs/libffi.a types.o)
          x86_64-w64-mingw32-objdump -h -t -s tmp/probe/types.o
          mkdir -p tmp/hashes-binary-windows
          ./bin/til.exe run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary windows-x64 tmp/hashes-binary-windows/windows-x64.txt bin/til.exe windows-x64
          # Run 3138: the two Linux hosts write the same til.exe and the
          # Windows host another one, with the same vendored objects. til's
          # lines by section, and the strings in the two debug sections that
          # differ (run 3138: .debug_info and .debug_line), to read from the
          # three logs what differs.
          grep "src/til.til til" tmp/hashes-binary-windows/windows-x64.txt
          x86_64-w64-mingw32-objcopy --dump-section .debug_line=tmp/probe/debug_line --dump-section .debug_info=tmp/probe/debug_info tmp/ci_collect/binary_windows-x64/til.exe tmp/probe/til_copy.exe
          x86_64-w64-mingw32-strings -a tmp/probe/debug_line | grep -E '[/\\]|\.[ch]$' | sort -u | head -80
          x86_64-w64-mingw32-strings -a tmp/probe/debug_info | grep -E '[/\\]|\.[ch]$' | sort -u | head -20
      - name: Upload the windows binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-windows-windows-x64
          path: tmp/hashes-binary-windows/windows-x64.txt

  # Issue #472: the two mac targets from the Windows host, the fifth host
  # that builds them. The pinned LLVM's Windows build (bin/make llvm)
  # first on PATH, as on the Linux hosts and the arm64 Mac; llvm-mingw
  # stays this host's own compiler by its own names. A job of its own, so
  # that it neither waits for the suite nor stops with it. One step per
  # stage, each run whatever the one before did, to read every failing
  # stage from one round. Strict since CI run 3198, where this host wrote
  # the other hosts' til for both targets at both widths: a difference
  # fails collect, and so does this job failing.
  windows-x64-mac:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: windows-x64 (mac targets with the pinned LLVM)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@v5
      - name: Install make, cmake and the bootstrap gcc into MSYS2
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake && uname -s && gcc --version"
      - name: The pinned llvm-mingw and LLVM releases
        id: pinned
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          llvm=$(sed -n 's/^LLVM_RELEASE := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          test -n "$llvm"
          echo "llvm-mingw=$release-$layout" >> "$GITHUB_OUTPUT"
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.pinned.outputs.llvm-mingw }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cache the pinned LLVM
        uses: actions/cache@v4
        with:
          path: vendor/llvm
          key: llvm-${{ steps.pinned.outputs.llvm }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download the pinned llvm-mingw with a bootstrap bin/make
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "make llvm_mingw && rm -rf bin tmp/boot vendor/libffi/build-windows-x64"
      - name: make
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "export PATH=$PWD/vendor/llvm-mingw/bin:$PATH && gcc --version && make"
      - name: The pinned LLVM
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PWD/vendor/llvm-mingw/bin:$PATH"
          ./bin/make llvm
          ls vendor/llvm/bin
          command -v clang
          clang --version
          clang --version | grep -q "clang version 23.1.5"
          ld64.lld --version
          clang -print-prog-name=dsymutil
      - name: A program for each mac target
        if: always()
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PWD/vendor/llvm-mingw/bin:$PATH"
          status=0
          for target in macos-arm64 macos-x64; do
            ./bin/til.exe build --target=$target -o tmp/hello_$target examples/hello_script.til && sha256sum tmp/hello_$target || status=1
          done
          exit $status
      - name: libffi for the mac targets
        if: always()
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PWD/vendor/llvm-mingw/bin:$PATH"
          status=0
          for target in macos-arm64 macos-x64; do
            ./bin/make vendor/libffi/build-$target/.libs/libffi.a && sha256sum vendor/libffi/build-$target/.libs/libffi.a || status=1
          done
          exit $status
      - name: nng for the mac targets
        if: always()
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PWD/vendor/llvm-mingw/bin:$PATH"
          status=0
          for target in macos-arm64 macos-x64; do
            ./bin/make vendor/nng/build-$target/libnng.a && sha256sum vendor/nng/build-$target/libnng.a || status=1
          done
          exit $status
      # One target at a time: a list is written when its last target is
      # done, so two lists keep the first target's lines whatever the
      # second does.
      - name: Write the mac binary hash lists with the pinned LLVM
        if: always()
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PWD/vendor/llvm-mingw/bin:$PATH"
          mkdir -p tmp/hashes-binary-mac tmp/hashes-binary-mac-x64
          status=0
          ./bin/til.exe run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary windows-x64 tmp/hashes-binary-mac/windows-x64.txt bin/til.exe macos-arm64 || status=1
          ./bin/til.exe run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary windows-x64 tmp/hashes-binary-mac-x64/windows-x64.txt bin/til.exe macos-x64 || status=1
          exit $status
      - name: Upload the macos-arm64 hash list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-mac-windows-x64
          path: tmp/hashes-binary-mac/windows-x64.txt
          if-no-files-found: error
      - name: Upload the macos-x64 hash list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-mac-x64-windows-x64
          path: tmp/hashes-binary-mac-x64/windows-x64.txt
          if-no-files-found: error

  # Issue #25 phase 1: native macOS. No continue-on-error anywhere: a
  # failed job fails the run, honestly red until the remaining darwin
  # bug is fixed. Runners are headless (no windowing session for
  # raylib), so run the no-gui suite -- same reason linux jobs need
  # xvfb. macos-latest is arm64; macos-15-intel is x64.
  #
  # The suite runs under ASAN (same as linux `make test`, minus gui):
  # the darwin frontier was heap corruption inside til itself that only
  # fired on mac-only code paths (the per-arch libffi binding bugs,
  # fixed); ASAN keeps mac honest the same way it keeps linux honest.
  #
  # Bounded -j: tests.til defaults its parallelism to the core count
  # (3-4 here), but the suite's memory does not fit that on these
  # runners -- measured on linux-x64: a small test's ASAN compile peaks
  # ~1GB and self_translate (til_asan translate src/til.til) peaks
  # 8.5GB. At default -j the OS silently SIGKILLs a random concurrent
  # process under memory pressure (empty captured stderr, no crash
  # report -- a SIGKILL leaves neither), the "churning victim" signature
  # of every mac failure since the suite went ASAN. -j2 got the roomier
  # macos-15-intel runner green (run 29149518241); the tighter arm64 M1
  # runner still lost 3 processes at -j2, so it drops to -j1. If -j1
  # still OOMs there, the single self_translate process is the ceiling
  # and the next lever is a smaller ASAN quarantine or running that one
  # test without ASAN.
  #
  # Issue #475: each push asks for ONE macos-latest and ONE macos-15-intel
  # runner. GitHub runs only a few macOS jobs of an account at once and
  # cancels a job that waits too long for one (run 3007: "The job was not
  # acquired by Runner of type hosted even after multiple attempts"), so
  # the small mac jobs live inside the native job of their architecture:
  # this one also cross-builds linux from the mac (the steps marked "host
  # cross"). Neither Mac job waits for another job (#473, S7): the mac
  # binaries the Linux job cross-builds used to be run here; now each Mac
  # runs the ones it builds itself without Apple's SDK, which collect holds
  # to the same bytes (the step "Run this Mac's SDK-less builds").
  macos-arm64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos-arm64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          echo "clang: $(clang --version 2>&1 | head -1)"
          echo "ld: $(ld -v 2>&1 | head -1)"
          echo "sdk: $(xcrun --show-sdk-version 2>&1 | head -1)"
      # Issue #472/#473: bin/til is built with the pinned LLVM, so that the
      # til this job runs is the file every other host builds for this
      # target (CI runs 3178 to 3188: the -pinned trial jobs' bin/til was
      # the cross-built one, and the whole suite passed on it). Only bin/til
      # and the two archives it links, libffi and nng: Apple's toolchain
      # builds everything else first (raylib, tinyfd, libsecp256k1, the
      # twins), and after this step builds every program, as a Mac user's
      # til does -- til asks `clang` which one it is at each build.
      # `make llvm` first: Apple's cc bootstraps bin/make, which downloads
      # the compiler. After it, bin/make and never make: the Makefile builds
      # bin/til_boot again each time, and bin/til after it with whatever
      # clang is first on PATH.
      - name: The pinned LLVM release
        id: llvm
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_RELEASE := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned LLVM
        uses: actions/cache@v4
        with:
          path: vendor/llvm
          key: llvm-${{ steps.llvm.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build bin/til with the pinned LLVM
        run: |
          make llvm
          ./bin/make vendor
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version
          clang --version | grep -q "clang version 23.1.5"
          ld64.lld --version
          rm -rf vendor/libffi/build-macos-arm64 vendor/nng/build-macos-arm64
          ./bin/make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/nng/build-macos-arm64/libnng.a
          ./bin/make bin/til
          shasum -a 256 bin/til > tmp/til-built.txt
          cat tmp/til-built.txt
      - name: Build and run tests (no gui, ASAN)
        run: |
          clang --version
          ./bin/make bin/til_asan bin/test_runner bin/plot bin/tests
          bin/tests --no-gui --til-bin bin/til_asan --asan -j1
          shasum -a 256 bin/til | cmp - tmp/til-built.txt
          # til runs `make` for a vendored archive when it packages an APK,
          # and the Makefile writes bin/til_boot again each time: newer than
          # bin/til, which bin/make would then build again, here with
          # Apple's toolchain. The bytes were just checked; only the time
          # is behind.
          touch bin/til
      - name: Test target build
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_script_macos_arm64 examples/hello_script.til
          file bin/hello_script_macos_arm64 | grep -q "Mach-O"
          ./bin/hello_script_macos_arm64
          ./bin/hello_script_macos_arm64 | grep -q "Hello World"
      # Native mac GUI: build every mode-gui example (chess, go, shootil,
      # ...) against the real Apple SDK frameworks, which the SDK-less
      # cross toolchain lacks. This is the only way mac GUI can be built
      # (frameworks are not redistributable for a linux cross), so proving
      # it here IS the mac-gui deliverable (issue #25). raylib/tinyfd were
      # already built natively by the suite step above.
      - name: Build native mac examples (gui + portable)
        run: ./bin/make build_mac
      # Issue #25: macOS as a HOST cross-compiling to the OTHER OSes, with
      # the bin/til the suite step built.
      # windows-x64 is no longer built here to be run on a Windows runner
      # (#473, S7): the windows list step below builds hello_script.exe,
      # til.exe and the rest, collect holds them to the bytes the Windows
      # host builds and tests itself (strict, five hosts: CI run 3178), and
      # a file that is the tested one needs no second run.
      # Linux uses a prebuilt cross-gcc (messense tap) via --cc, the same
      # override the riscv32 job uses. Compiled programs bind ext_func to
      # direct C symbols and never reference libffi, so no cross libffi is
      # needed. The artifacts run on a real linux runner
      # (macos-host-cross-linux-run below), until the linux targets are in
      # the lists the same way (#504).
      - name: Install cross toolchains (host cross)
        run: |
          brew tap messense/macos-cross-toolchains
          # Homebrew's tap-trust check blocks third-party formulae until
          # the tap is explicitly trusted; the linux cross-gcc lives in
          # this tap (homebrew-core ships no linux cross-gcc).
          brew trust messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu
      # The pinned llvm-mingw (make.til LLVM_MINGW_RELEASE and _LAYOUT), unpacked by
      # `make llvm_mingw` into vendor/llvm-mingw, kept between runs: one
      # cache entry per release and runner kind.
      - name: The pinned llvm-mingw release (host cross)
        id: llvm-mingw
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          echo "release=$release-$layout" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw (host cross)
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross-compile hello_script for linux-x64 (host cross)
        run: |
          ./bin/til build --target=linux-x64 --cc=x86_64-unknown-linux-gnu-gcc \
            -o bin/hello_script-from-mac-linux examples/hello_script.til
          file bin/hello_script-from-mac-linux | grep -q "ELF 64-bit"
      # Issue #420: std/crypto for linux-x64 from a mac. The canonical
      # libsecp256k1 archive is the mac's own, so linux-x64 links its
      # cross archive, built with the same messense gcc (LINUX_X64_CC);
      # test/crypto.til -- the SHA-256 and BIP-340 vectors -- runs on the
      # linux runner below.
      - name: Cross-compile the std/crypto test for linux-x64 (host cross)
        run: |
          LINUX_X64_CC=x86_64-unknown-linux-gnu-gcc ./bin/make vendor/secp256k1/build-linux-x64/lib/libsecp256k1.a
          ./bin/til build --target=linux-x64 --cc=x86_64-unknown-linux-gnu-gcc \
            -o bin/crypto-from-mac-linux test/crypto.til
          file bin/crypto-from-mac-linux | grep -q "ELF 64-bit"
      - name: Upload cross artifacts (host cross)
        uses: actions/upload-artifact@v4
        with:
          name: hello_script-from-mac
          path: |
            bin/hello_script-from-mac-linux
            bin/crypto-from-mac-linux
      # Issue #473 (C3): this host's hash list for the collect job, as in
      # linux-x64. Hashes come from shasum here.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce macos-arm64 tmp/hashes/macos-arm64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-macos-arm64
          path: tmp/hashes/macos-arm64.txt
          if-no-files-found: error
      # Issue #472: this Mac's own build of its target with the pinned LLVM
      # release the Linux hosts use for the mac targets (see the
      # windows-x64-build job). With that clang first on PATH til builds the
      # mac targets here as it does everywhere else -- vendor/macos, lld,
      # named objects -- not with Apple's SDK and linker (targets.til,
      # macos_is_cross), and bin/make builds this host's own libffi and nng
      # the same way (make.til, builds_as_host): the job's first build step
      # did that, with bin/til. The mac targets are strict in collect;
      # Android producer failures are blocking after 3167.
      - name: Write the mac and Android binary hash list with the pinned LLVM
        run: |
          # The file the first step built, still: this list's "make bin/til".
          shasum -a 256 bin/til | cmp - tmp/til-built.txt
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version | grep -q "clang version 23.1.5"
          # This Mac's own libffi and nng are the pinned compiler's since
          # the first step; the other Mac's are built here.
          rm -rf vendor/libffi/build-macos-x64 vendor/nng/build-macos-x64
          ./bin/make vendor/libffi/build-macos-x64/.libs/libffi.a vendor/nng/build-macos-x64/libnng.a
          # The macOS SDK producer compares the same unsigned APK payload as
          # Linux x64; its independently created debug signature is excluded.
          export TMPDIR="$PWD/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$PWD/tmp"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"
          ./bin/make vendor/raylib/build-android-x64/libraylib.a vendor/raylib/build-android-arm64/libraylib.a
          ./bin/til run test/reproducible_build.til bin/til android-x64
          ./bin/til run test/reproducible_build.til bin/til android-arm64
          mkdir -p tmp/hashes-binary
          # macos-x64 too: the Intel Mac has no pinned LLVM to build its own
          # target with, so this Mac is the third host that builds it.
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary macos-arm64 tmp/hashes-binary/macos-arm64.txt bin/til macos-arm64 macos-x64 android-x64 android-arm64
      - name: Upload the binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-macos-arm64
          path: tmp/hashes-binary/macos-arm64.txt
          if-no-files-found: error
      # Issue #473 (S7): the files this Mac built for itself without
      # Apple's SDK, run here. They used to come from the Linux job
      # (macos-cross-build), and this job waited for it to end. collect
      # holds this Mac's hello_script and til to the bytes every other host
      # builds for this target, so running these is running those, and no
      # job waits for another. The three programs outside the lists are
      # built the same way, libsecp256k1 for them too. til goes to bin/
      # first: it finds its support tree beside the directory it is in.
      - name: Run this Mac's SDK-less builds
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          built=tmp/ci_collect/binary_macos-arm64
          $built/hello_script | grep -q "Hello World"
          cp $built/til bin/til_sdkless
          ./bin/til_sdkless interpret examples/hello_script.til | grep -q "Hello World"
          ./bin/til_sdkless interpret test/ext_libc.til
          rm -rf vendor/secp256k1/build-macos-arm64
          ./bin/make vendor/secp256k1/build-macos-arm64/lib/libsecp256k1.a
          mkdir -p tmp/sdkless
          ./bin/til build --target=macos-arm64 -o tmp/sdkless/crypto test/crypto.til
          ./bin/til build --target=macos-arm64 -o tmp/sdkless/ffi_prep test/ffi_prep.til
          ./bin/til build --target=macos-arm64 --extra-modes=examples/custom_modes.til -o tmp/sdkless/nng_pair test/nng_pair.til
          tmp/sdkless/crypto
          tmp/sdkless/ffi_prep | grep -q "ffi_prep ok"
          tmp/sdkless/nng_pair | grep -q "nng pair ok"
      # Issue #472: windows-x64 from this Mac, with the pinned llvm-mingw
      # (unpacked here by bin/make, cached by the steps above): the fourth
      # host that builds til.exe. Last on PATH, not first: til finds the windows compiler by
      # its prefixed name, and a `clang` ahead of Apple's would make til
      # build this Mac's own programs (the collector here) without the SDK
      # and with a linker llvm-mingw does not have. Strict since CI run
      # 3173, where both Macs wrote the Linux hosts' til.exe: bin/make takes
      # the windows side of llvm-mingw from its Linux package on a Mac.
      - name: Write the windows binary hash list with the pinned llvm-mingw
        run: |
          ./bin/make llvm_mingw
          export PATH="$PATH:$PWD/vendor/llvm-mingw/bin"
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc --version | grep -q clang
          rm -rf vendor/libffi/build-windows-x64 vendor/nng/build-windows-x64
          ./bin/make vendor/libffi/build-windows-x64/.libs/libffi.a vendor/nng/build-windows-x64/libnng.a
          mkdir -p tmp/hashes-binary-windows
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary macos-arm64 tmp/hashes-binary-windows/macos-arm64.txt bin/til windows-x64
      - name: Upload the windows binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-windows-macos-arm64
          path: tmp/hashes-binary-windows/macos-arm64.txt
          if-no-files-found: error
      # Issue #473: wasm32 from this Mac too (see the wasm32 job).
      - name: Write the wasm32 binary hash list
        if: false
        continue-on-error: true
        run: |
          ./bin/make vendor/secp256k1/build-wasm32/lib/libsecp256k1.a
          mkdir -p tmp/hashes-binary-wasm
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary-trial macos-arm64 tmp/hashes-binary-wasm/macos-arm64.txt bin/til wasm32
          cat tmp/hashes-binary-wasm/macos-arm64.txt
      - name: Upload the wasm32 binary hash list
        if: false
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-wasm-macos-arm64
          path: tmp/hashes-binary-wasm/macos-arm64.txt
      # Guard Malloc puts every allocation on its own guarded page, so
      # an out-of-bounds or use-after-free write faults AT THE CULPRIT
      # INSTRUCTION (even from uninstrumented code like libffi asm) and
      # its crash report names the writer -- the backup net for whatever
      # ASAN cannot see. test/loops.til is a compile that has crashed
      # on these runners before; til_boot is the fallback when the
      # crash happened before bin/til was built.
      - name: Guard Malloc probe
        if: failure()
        timeout-minutes: 45
        run: |
          if [ -x bin/til ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til translate -c tmp/gm_probe.c test/loops.til || true
          elif [ -x bin/til_boot ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til_boot translate -c tmp/gm_probe.c test/loops.til || true
          fi
      # macOS crash reasons land in .ips crash reports, not stderr.
      # ReportCrash writes them asynchronously -- sometimes well past
      # 10s, occasionally to the system directory -- hence the long
      # sleep and both dirs (a 10s single-dir version missed every
      # report in runs 29027527473/x64 and 29045082029/arm64). Print a
      # COMPACT digest (procName + exception + faulting-thread frames)
      # instead of raw cats: full macOS-26 .ips files are >5000 lines
      # each and bury everything else past the log API's tail window
      # (run 29050250037). The full reports still go into the artifact
      # together with the binaries they reference (issue #25).
      - name: Dump crash reports
        if: failure()
        run: |
          sleep 30
          ls -l ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          mkdir -p tmp/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          sudo cp /Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          cp bin/til bin/til_boot tmp/crash/ 2>/dev/null || true
          python3 - <<'EOF'
          import glob, json
          for p in sorted(glob.glob('tmp/crash/*.ips')):
              print('=== digest:', p)
              try:
                  raw = open(p).read()
                  body = json.loads(raw[raw.index('\n'):])
                  for k in ('procName', 'parentProc', 'exception', 'termination', 'asi'):
                      if k in body: print(k, ':', json.dumps(body[k]))
                  t = body['threads'][body.get('faultingThread', 0)]
                  for f in t.get('frames', []):
                      src = f.get('sourceFile', '')
                      line = f.get('sourceLine', '')
                      loc = ' {}:{}'.format(src, line) if src else ''
                      print('  frame img={} off={} {}{}'.format(
                          f.get('imageIndex'), f.get('imageOffset'),
                          f.get('symbol', '?'), loc))
              except Exception as e:
                  print('  digest failed:', e)
          EOF
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-macos-arm64
          path: tmp/crash/
          if-no-files-found: ignore

  macos-x64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos-x64 (native)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          echo "clang: $(clang --version 2>&1 | head -1)"
          echo "ld: $(ld -v 2>&1 | head -1)"
          echo "sdk: $(xcrun --show-sdk-version 2>&1 | head -1)"
      # Issue #472/#473: bin/til is built with this Mac's pinned compiler,
      # as in the macos-arm64 job: llvm-mingw's clang and lld under the mac
      # names (LLVM publishes no build for Intel macOS; see the list step
      # below). Only bin/til and the two archives it links.
      - name: The pinned llvm-mingw release
        id: llvm-mingw
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          echo "release=$release-$layout" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build bin/til with llvm-mingw's clang
        run: |
          make llvm_mingw
          ./bin/make vendor
          mkdir -p tmp/mac-tools
          for tool in clang llvm-ar llvm-ranlib llvm-nm llvm-objcopy; do ln -sf "$PWD/vendor/llvm-mingw/bin/$tool" "tmp/mac-tools/$tool"; done
          ln -sf "$PWD/vendor/llvm-mingw/bin/lld" tmp/mac-tools/ld64.lld
          ln -sf "$PWD/vendor/llvm-mingw/bin/lld" tmp/mac-tools/ld.lld
          export PATH="$PWD/tmp/mac-tools:$PATH"
          clang --version
          clang --version | grep -q "clang version 23.1.5"
          ld64.lld --version
          rm -rf vendor/libffi/build-macos-x64 vendor/nng/build-macos-x64
          ./bin/make vendor/libffi/build-macos-x64/.libs/libffi.a vendor/nng/build-macos-x64/libnng.a
          ./bin/make bin/til
          shasum -a 256 bin/til > tmp/til-built.txt
          cat tmp/til-built.txt
      - name: Build and run tests (no gui, ASAN)
        run: |
          clang --version
          ./bin/make bin/til_asan bin/test_runner bin/plot bin/tests
          bin/tests --no-gui --til-bin bin/til_asan --asan -j2
          shasum -a 256 bin/til | cmp - tmp/til-built.txt
          # til runs `make` for a vendored archive when it packages an APK,
          # and the Makefile writes bin/til_boot again each time: newer than
          # bin/til, which bin/make would then build again, here with
          # Apple's toolchain. The bytes were just checked; only the time
          # is behind.
          touch bin/til
      - name: Test target build
        run: |
          ./bin/til build --target=macos-x64 -o bin/hello_script_macos_x64 examples/hello_script.til
          file bin/hello_script_macos_x64 | grep -q "Mach-O"
          ./bin/hello_script_macos_x64
          ./bin/hello_script_macos_x64 | grep -q "Hello World"
      # Native mac GUI build -- see the macos-arm64 job for the rationale.
      - name: Build native mac examples (gui + portable)
        run: ./bin/make build_mac
      # Issue #473 (C3): this host's hash list for the collect job.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce macos-x64 tmp/hashes/macos-x64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-macos-x64
          path: tmp/hashes/macos-x64.txt
          if-no-files-found: error
      # Issue #472: this Mac's own build of its target. LLVM publishes no
      # release for Intel macOS, so the pinned LLVM cannot run here; the
      # pinned llvm-mingw can (its macOS package is universal), and its
      # clang 23.1.5 with its lld under the name ld64.lld writes the
      # macos-x64 til the pinned LLVM writes, byte for byte (CI run 3166,
      # asked on Linux x64 where both are). llvm-mingw ships lld without
      # the mac names and no dsymutil: the two lld names are links made
      # here, and clang finds Apple's dsymutil, whose .dSYM is not part of
      # the program. With that clang first on PATH til and bin/make build
      # the mac targets here as every other host does (targets.til,
      # macos_is_cross; make.til, builds_as_host). Strict since CI runs
      # 3167, 3173 and 3178 showed this Mac's lists for both mac targets
      # equal to the other three hosts'.
      - name: Write the binary hash list with llvm-mingw's clang
        run: |
          # The file the first step built, still: this list's "make bin/til".
          shasum -a 256 bin/til | cmp - tmp/til-built.txt
          export PATH="$PWD/tmp/mac-tools:$PATH"
          clang --version | grep -q "clang version 23.1.5"
          # This Mac's own libffi and nng are the pinned compiler's since
          # the first step; the other Mac's are built here.
          rm -rf vendor/libffi/build-macos-arm64 vendor/nng/build-macos-arm64
          ./bin/make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/nng/build-macos-arm64/libnng.a
          mkdir -p tmp/hashes-binary
          # Its own target and the other Mac's: til has to be the same file
          # from every host that builds it (Jorge, 2026-11-19).
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary macos-x64 tmp/hashes-binary/macos-x64.txt bin/til macos-x64 macos-arm64
      - name: Upload the binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-macos-x64
          path: tmp/hashes-binary/macos-x64.txt
          if-no-files-found: error
      # Issue #473 (S7): the files this Mac built for itself without
      # Apple's SDK, run here. They used to come from the Linux job
      # (macos-cross-build), and this job waited for it to end. collect
      # holds this Mac's hello_script and til to the bytes every other host
      # builds for this target, so running these is running those, and no
      # job waits for another. The three programs outside the lists are
      # built the same way, libsecp256k1 for them too. til goes to bin/
      # first: it finds its support tree beside the directory it is in.
      - name: Run this Mac's SDK-less builds
        run: |
          export PATH="$PWD/tmp/mac-tools:$PATH"
          built=tmp/ci_collect/binary_macos-x64
          $built/hello_script | grep -q "Hello World"
          cp $built/til bin/til_sdkless
          ./bin/til_sdkless interpret examples/hello_script.til | grep -q "Hello World"
          ./bin/til_sdkless interpret test/ext_libc.til
          rm -rf vendor/secp256k1/build-macos-x64
          ./bin/make vendor/secp256k1/build-macos-x64/lib/libsecp256k1.a
          mkdir -p tmp/sdkless
          ./bin/til build --target=macos-x64 -o tmp/sdkless/crypto test/crypto.til
          ./bin/til build --target=macos-x64 -o tmp/sdkless/ffi_prep test/ffi_prep.til
          ./bin/til build --target=macos-x64 --extra-modes=examples/custom_modes.til -o tmp/sdkless/nng_pair test/nng_pair.til
          tmp/sdkless/crypto
          tmp/sdkless/ffi_prep | grep -q "ffi_prep ok"
          tmp/sdkless/nng_pair | grep -q "nng pair ok"
      # Issue #472: windows-x64 from this Mac too, as on the arm64 Mac:
      # llvm-mingw last on PATH, so that Apple's clang stays this Mac's
      # own compiler. Strict, like there.
      - name: Write the windows binary hash list with the pinned llvm-mingw
        run: |
          export PATH="$PATH:$PWD/vendor/llvm-mingw/bin"
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc --version | grep -q clang
          rm -rf vendor/libffi/build-windows-x64 vendor/nng/build-windows-x64
          ./bin/make vendor/libffi/build-windows-x64/.libs/libffi.a vendor/nng/build-windows-x64/libnng.a
          mkdir -p tmp/hashes-binary-windows
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary macos-x64 tmp/hashes-binary-windows/macos-x64.txt bin/til windows-x64
      - name: Upload the windows binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-windows-macos-x64
          path: tmp/hashes-binary-windows/macos-x64.txt
          if-no-files-found: error
      # See the macos-arm64 job for what the probe and the dump step
      # are for and why they look like this.
      - name: Guard Malloc probe
        if: failure()
        timeout-minutes: 45
        run: |
          if [ -x bin/til ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til translate -c tmp/gm_probe.c test/loops.til || true
          elif [ -x bin/til_boot ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til_boot translate -c tmp/gm_probe.c test/loops.til || true
          fi
      - name: Dump crash reports
        if: failure()
        run: |
          sleep 30
          ls -l ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          mkdir -p tmp/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          sudo cp /Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          cp bin/til bin/til_boot tmp/crash/ 2>/dev/null || true
          python3 - <<'EOF'
          import glob, json
          for p in sorted(glob.glob('tmp/crash/*.ips')):
              print('=== digest:', p)
              try:
                  raw = open(p).read()
                  body = json.loads(raw[raw.index('\n'):])
                  for k in ('procName', 'parentProc', 'exception', 'termination', 'asi'):
                      if k in body: print(k, ':', json.dumps(body[k]))
                  t = body['threads'][body.get('faultingThread', 0)]
                  for f in t.get('frames', []):
                      src = f.get('sourceFile', '')
                      line = f.get('sourceLine', '')
                      loc = ' {}:{}'.format(src, line) if src else ''
                      print('  frame img={} off={} {}{}'.format(
                          f.get('imageIndex'), f.get('imageOffset'),
                          f.get('symbol', '?'), loc))
              except Exception as e:
                  print('  digest failed:', e)
          EOF
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-macos-x64
          path: tmp/crash/
          if-no-files-found: ignore

  # Issue #25 phase 2: SDK-less cross-compilation from the canonical
  # linux-x64 host to both mac targets (vendored zig-derived headers +
  # libSystem.tbd + distro clang/lld), with the artifacts executed on
  # the real mac runners -- the same build/run pair shape as
  # windows-x64. Keeping linux-x64 as the single cross host avoids a
  # combinatorial host-x-target explosion in CI.
  macos-cross-build:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos (cross-compile on linux)
    # ubuntu-24.04, not ubuntu-latest, on purpose (#472 level 3, the toolchain
    # rule at the end of issues/open/472.org): the mac targets' toolchain is
    # this release's clang, lld and llvm 18.1.3 with the repository's
    # vendor/macos. The other producer of mac binaries, linux-arm64-native,
    # runs on ubuntu-24.04-arm and gets the same packages, so the collect job
    # can compare what the two hosts build. ubuntu-latest (26.04) has clang
    # 21, and no clang package version is common to the two releases.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang lld llvm cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld.lld llvm-ar dsymutil; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for macos-arm64 and macos-x64
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_script-macos-arm64 examples/hello_script.til
          file bin/hello_script-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/hello_script-macos-x64 examples/hello_script.til
          file bin/hello_script-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      # Issue #472 (F1a): see the linux-arm64 job. Build only.
      - name: Build the layout corpus for macos-arm64 and macos-x64
        run: |
          for arch in arm64 x64; do
            for width in 32 64; do
              ./bin/til build --target=macos-$arch --usize=$width -o bin/layout_corpus-macos-$arch test/layout_corpus.til
            done
          done
      # Issue #235: std/crypto for both mac arches. libsecp256k1 builds
      # from the vendored source against the SDK-less headers (clang +
      # llvm-ar, like the mac gui archives); the binaries run on the mac
      # runners below. Built before the corpus sweep so test/crypto.til
      # links there too.
      - name: Cross-compile the std/crypto test for macos-arm64 and macos-x64
        run: |
          make vendor/secp256k1/build-macos-arm64/lib/libsecp256k1.a vendor/secp256k1/build-macos-x64/lib/libsecp256k1.a
          ./bin/til build --target=macos-arm64 -o bin/crypto-macos-arm64 test/crypto.til
          file bin/crypto-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/crypto-macos-x64 test/crypto.til
          file bin/crypto-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      # Issue #420: libffi for both mac arches, configured out of tree
      # against the same SDK-less headers (and lld + libSystem.tbd for
      # configure's probe links). test/ffi_prep.til calls it directly, and
      # til itself links it for the interpreter's ext_func dispatch; the
      # mac runners below run both, the cross-built til interpreting.
      # Issue #422: nng for both mac arches, SDK-less like the archives above
      # -- til itself links it, and test/nng_pair.til (a one-process round
      # trip over inproc://) runs on the mac runners below.
      - name: Cross-compile libffi programs, the nng test and til for macos-arm64 and macos-x64
        run: |
          make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/libffi/build-macos-x64/.libs/libffi.a
          make vendor/nng/build-macos-arm64/libnng.a vendor/nng/build-macos-x64/libnng.a
          for arch in arm64 x64; do
            ./bin/til build --target=macos-$arch -o bin/ffi_prep-macos-$arch test/ffi_prep.til
            ./bin/til build --target=macos-$arch --extra-modes=examples/custom_modes.til \
              -o bin/nng_pair-macos-$arch test/nng_pair.til
            ./bin/til build --target=macos-$arch -o bin/til-macos-$arch src/til.til
          done
          file bin/ffi_prep-macos-arm64 bin/til-macos-arm64 | grep -c "Mach-O 64-bit arm64" | grep -q 2
          file bin/ffi_prep-macos-x64 bin/til-macos-x64 | grep -c "Mach-O 64-bit x86_64" | grep -q 2
      # Issue #369: put clang over the WHOLE corpus on linux, not just the
      # one example above. Every linux job compiles the generated C with gcc
      # (toolchain_command hardcodes it), so clang first saw the corpus on
      # the two slowest jobs in the run -- and the emitter already carries
      # four workarounds for things clang rejects and gcc accepts in
      # silence, every one of them found as "green linux, red mac". The most
      # recent (e3085558's `Color_TAG_Red == Color_TAG_Red`) passed 356/356
      # here and reddened both mac jobs and nothing else.
      #
      # Going through the DRIVER is the point: it knows each file's flags,
      # which a hand-rolled `for f in gen/til/*.c; clang ...` sweep has to
      # relearn and gets wrong (usize64*.c need --usize=64, bindgen_raylib.c
      # has its own `format` signature).
      #
      # A file counts as failing only when clang emits a warning-as-error
      # -- the `[-W...]` marker. That is exactly the class this exists for,
      # and it deliberately ignores the two other ways a cross build ends:
      # til's own type errors (every test/*_error.til is MEANT to fail the
      # typer, as are the interp-only files) and link failures with no
      # compile diagnostic (ffi_dlopen_fail.til references an undefined
      # symbol on purpose; the gui/nng examples want mac frameworks and
      # native libs that are not vendored here). Keying on the marker needs
      # no skip list, so a new test cannot silently fall out of coverage.
      # Issue #472 (L3a): the suite's reproducible_build row covers the host
      # target; this is the same driver for the two mac targets, whose
      # executables are linked from named objects so that the Mach-O debug
      # map is the same in every build. A program and a library, from two
      # checkout roots and at two times, compared byte for byte.
      - name: Build for macos-arm64 and macos-x64 reproducibly
        run: |
          ./bin/til run test/reproducible_build.til bin/til macos-arm64
          ./bin/til run test/reproducible_build.til bin/til macos-x64
      - name: Cross-compile the corpus for macos-arm64 (clang -Werror)
        run: |
          status=0
          for f in test/*.til examples/*.til; do
            log=$(./bin/til build --target=macos-arm64 -o tmp/xcheck "$f" 2>&1 || true)
            # Issue #472 (F1a): a failed layout assert is not a warning and
            # carries no `[-W` marker, but it is exactly as much the
            # compiler's verdict on the emitted C.
            if printf '%s' "$log" | grep -q -e '\[-W' -e 'static assertion failed'; then
              echo "=== $f"
              printf '%s\n' "$log" | grep -e '\[-W' -e 'static assertion failed' | head -5
              status=1
            fi
          done
          exit $status

  macos-host-cross-linux-run:
    name: macos host cross (run ELF on linux)
    needs: macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download cross artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello_script-from-mac
      - name: Run mac-built ELF
        run: |
          chmod +x hello_script-from-mac-linux
          ./hello_script-from-mac-linux
          ./hello_script-from-mac-linux | grep -q "Hello World"
      - name: Run the mac-built std/crypto test
        run: |
          chmod +x crypto-from-mac-linux
          ./crypto-from-mac-linux

  # Issue #25 phase 3 / #232: mac GUI cross from Linux end to end, with NO
  # mac and NO Apple SDK. raylib's RGFW desktop backend drives Cocoa through
  # the objc runtime (objc_msgSend), so it cross-compiles against the
  # SDK-less framework-type shims (vendor/macos/frameworks-shim); the
  # build_mac_raylib steps in make.til build the per-arch archives on linux
  # and examples/gen_framework_stubs.til --linux-map emits the .tbd link stubs from
  # their external symbols (the real Cocoa/OpenGL/... dylibs bind at runtime
  # on the target mac, exactly like the vendored libSystem.tbd). This job
  # builds the whole chain on linux and asserts a valid Mach-O per arch --
  # the mac analogue of the mingw-cross windows gui, no prebuilt binaries.
  macos-gui-cross:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos gui (cross-compile on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang lld llvm
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld.lld llvm-ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      # The one job that drives the build program DIRECTLY (issue #345):
      # everywhere else `make <goals>` builds bin/make and hands the
      # goals over, so this is what proves the direct interface -- the
      # same multi-goal artifact request, one invocation, no Make.
      - name: Build mac raylib + tinyfd + framework stubs on linux (no SDK)
        run: |
          make bin/make
          ./bin/make vendor/macos/frameworks/.stamp vendor/tinyfiledialogs/build-macos-arm64/libtinyfd.a vendor/tinyfiledialogs/build-macos-x64/libtinyfd.a
      - name: Cross-compile a mode-gui example for both mac arches
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_gui-macos-arm64 examples/hello_gui.til
          file bin/hello_gui-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/hello_gui-macos-x64 examples/hello_gui.til
          file bin/hello_gui-macos-x64 | grep -q "Mach-O 64-bit x86_64"
          # #83: same editor.til coverage as the windows gui cross job.
          ./bin/til build --target=macos-arm64 -o bin/editor-macos-arm64 examples/editor.til
          file bin/editor-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/editor-macos-x64 examples/editor.til
          file bin/editor-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      - name: Upload mac gui artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_gui-macos
          path: |
            bin/hello_gui-macos-arm64
            bin/hello_gui-macos-x64

  # Issue #473 (C3): one place that says what every producer delivered and
  # whether their outputs agree. It runs whatever the producers' results
  # were, prints each one, and compares the hash lists they uploaded with
  # examples/ci_collect.til. A producer that did not succeed, or whose list
  # is not there, fails this job. So does any difference between producers,
  # or an item one of them left out: run 3085 had all five producers agree on
  # every item (870 frontend observations, 270 translated files), and #472
  # holds levels 1 and 2 to that from here on. It still runs after another
  # job cancelled the run (run 3067): the producers were cancelled, no list
  # arrived, and it failed saying so.
  collect:
    name: collect (compare the producers' hash lists)
    needs: [doc-gate, linux-x64, linux-arm64-native, windows-x64-native, windows-x64-build, macos-arm64, macos-x64, macos-cross-build, windows-x64-mac]
    if: always() && needs.doc-gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Producer results
        env:
          LINUX_X64: ${{ needs.linux-x64.result }}
          LINUX_ARM64: ${{ needs.linux-arm64-native.result }}
          WINDOWS_X64_NATIVE: ${{ needs.windows-x64-native.result }}
          MACOS_ARM64: ${{ needs.macos-arm64.result }}
          MACOS_X64: ${{ needs.macos-x64.result }}
          MACOS_CROSS: ${{ needs.macos-cross-build.result }}
          WINDOWS_X64_MAC: ${{ needs.windows-x64-mac.result }}
        run: |
          status=0
          for pair in "linux-x64=$LINUX_X64" "linux-arm64-native=$LINUX_ARM64" \
            "windows-x64-native=$WINDOWS_X64_NATIVE" \
            "macos-arm64=$MACOS_ARM64" "macos-x64=$MACOS_X64" \
            "macos-cross-build=$MACOS_CROSS" "windows-x64-mac=$WINDOWS_X64_MAC"; do
            echo "$pair"
            if [ "${pair#*=}" != success ]; then status=1; fi
          done
          exit $status
      - name: Download the producers' hash lists
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
      - name: Create test tmp directory
        if: always()
        run: mkdir -p tmp hashes
      - name: Build bin/til
        if: always()
        run: make
      - name: Compare the hash lists
        if: always()
        run: |
          find hashes -type f | sort
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til collect hashes
