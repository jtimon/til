name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs on any branch: lets bot sessions iterate on
  # platform-specific jobs (issue #25 macos bring-up) from a feature
  # branch instead of burning a master merge per attempt.
  workflow_dispatch:

# Every job ends with "Cancel the rest of this run", which runs only when
# one of its steps failed and cancels the whole run (actions: write), so a
# failing commit stops holding runners. The failing job keeps its log and
# its failure; the cancelled jobs report no result for that commit, and a
# second, independent failure shows only once the first one is fixed.
permissions:
  contents: read
  actions: write

jobs:
  # A push whose commits are all documentation-only ("Doc: " subject,
  # CLAUDE.md "Commits") runs nothing else: every other root job needs
  # this one, and jobs downstream of a skipped job are skipped too. Pull
  # requests, manual runs and pushes with any non-Doc commit run the full
  # workflow. github.event.commits is empty for some pushes (a branch
  # creation, a push of more than 2048 commits); those run everything.
  doc-gate:
    name: 'Skip CI when every pushed commit is "Doc: "'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ "$EVENT" != push ]; then
            code=true
          else
            printf '%s\n' "$COMMITS" | jq -r '.[] | .message | split("\n")[0]'
            code=$(printf '%s' "$COMMITS" | jq -r 'if length == 0 then "true" elif all(.[]; .message | startswith("Doc: ")) then "false" else "true" end')
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # GL/X11 headers are vendored (#59, #92); GUI execution needs only
  # runtime libraries, Mesa and Xvfb, not graphics development packages.
  templeos:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: TempleOS guest (QEMU TCG, USize 32/64)
    runs-on: ubuntu-latest
    # The guest corpus runs every case at both widths under QEMU TCG,
    # ~44s each, then a deliberate 3-minute timeout case: 52 minutes on
    # run 2802 and past 60 once the #151 GUI cases joined (runs
    # 2806-2811 cancelled at the old limit). A hung guest is caught by
    # the expect driver's own 180s deadline, not by this budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Run native guest acceptance
        run: make test_templeos
      - name: Upload guest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: templeos-diagnostics
          path: |
            tmp/templeos/*.log
            tmp/templeos/*.HC
            tmp/templeos/*.ppm
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-x64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      # Issue #472 (L3b) / #473 (C4): which C compiler, linker and archiver
      # this runner really has. Comparing binaries between producers means
      # one pinned toolchain per target, and the first step is knowing what
      # each job uses today. Printed in every job that compiles C.
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run tests
        run: make test_asan
      - name: Test target build
        run: |
          ./bin/til build --target=linux-x64 -o bin/hello_script_x64 examples/hello_script.til
          file bin/hello_script_x64 | grep -q "x86-64"
          ./bin/hello_script_x64
      # This host's JNI jar, for jni-jar-merge.
      - name: Build the JNI test jar
        run: ./bin/til build --jni test/jni_lib.til
      - name: Upload the JNI test jar
        uses: actions/upload-artifact@v4
        with:
          name: jni-jar-linux-x64
          path: |
            gen/lib/jni_lib.jar
            gen/til/java/til/jni_lib/JniLib.java
      # Issue #473 (C5, C6) / #472 (levels 1 and 2 across hosts): what this
      # host's compiler makes of the corpus, as a list of hashes -- the
      # state at each phase boundary for one target, and the source every
      # target translates to. The collect job compares the lists of all
      # producers. About two minutes.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce linux-x64 tmp/hashes/linux-x64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-linux-x64
          path: tmp/hashes/linux-x64.txt
          if-no-files-found: error
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # One layout flag (doc/self.org): --usize=32, the compact layout (U32
  # widths, own pointers in the #313 cage), is the default on 64-bit C
  # targets, so every other job runs on it. This job keeps the native
  # layout alive: make check_usize64 runs the --usize=64 regressions, then
  # the whole suite through a compiler built --usize=64 (under ASAN), with
  # every program built --usize=64 too.
  linux-x64-usize64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-x64 (--usize=64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Suite through the native-layout compiler
        run: make check_usize64
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #25: aarch64-linux as a native HOST (GitHub's free arm64
  # runners), running the full suite. Blocking like every other linux
  # job: its bring-up failures (plain-char signedness) were fixed by
  # the -fsigned-char contract and the suite is green here.
  linux-arm64-native:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-arm64 (native)
    runs-on: ubuntu-24.04-arm
    # GCC 13's libasan turns detect_stack_use_after_return on by default,
    # and its fake-stack frames are pathologically slow on this aarch64
    # runner: a hello_script translate by bin/til_asan takes 77s of pure
    # user CPU (0.5s without ASAN, 3.5s under ASAN on linux-x64) and 1.2s
    # with the fake stack off -- the same 1.2s as building the compiler
    # with --param asan-use-after-return=0, while every other ASAN switch
    # (stack redzones, use-after-scope, out-of-line checks, globals,
    # unwinder, quarantine, leak check) leaves it at 65-82s. That 60x
    # made the suite take 6h here, GitHub's per-job limit (runs 2723-2735
    # cancelled). Only this job opts out; the x64 suite keeps the check.
    env:
      ASAN_OPTIONS: detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in aarch64-linux-gnu-gcc gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run tests
        run: make test_asan
      - name: Test target build
        run: |
          ./bin/til build --target=linux-arm64 -o bin/hello_script_arm64_native examples/hello_script.til
          file bin/hello_script_arm64_native | grep -q "aarch64"
          ./bin/hello_script_arm64_native
          ./bin/hello_script_arm64_native | grep -q "Hello World"
      # This host's JNI jar, for jni-jar-merge.
      - name: Build the JNI test jar
        run: ./bin/til build --jni test/jni_lib.til
      - name: Upload the JNI test jar
        uses: actions/upload-artifact@v4
        with:
          name: jni-jar-linux-arm64
          path: |
            gen/lib/jni_lib.jar
            gen/til/java/til/jni_lib/JniLib.java
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce linux-arm64 tmp/hashes/linux-arm64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-linux-arm64
          path: tmp/hashes/linux-arm64.txt
          if-no-files-found: error
      # Issue #472 (level 3) / #473 (C7): what this host builds for the two
      # mac targets, with the identity of the clang, lld, llvm-ar and
      # dsymutil that built it. The collect job compares these binaries
      # between producers only where the toolchains are the same (the
      # toolchain rule, end of issues/open/472.org) and says so where they
      # are not. The mac headers and libraries are the repository's
      # vendor/macos on every host.
      - name: Install the mac cross toolchain
        run: sudo apt-get install -y clang lld llvm
      - name: Write the binary hash lists for the collector
        run: |
          mkdir -p tmp/hashes-binary
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-arm64 tmp/hashes-binary/linux-arm64.txt bin/til macos-arm64 macos-x64
      - name: Upload the binary hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-linux-arm64
          path: tmp/hashes-binary/linux-arm64.txt
          if-no-files-found: error
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-arm64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri gcc-aarch64-linux-gnu qemu-user cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc aarch64-linux-gnu-gcc aarch64-linux-gnu-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for linux-arm64
        run: |
          ./bin/til build --target=linux-arm64 -o bin/hello_script_arm64 examples/hello_script.til
          file bin/hello_script_arm64 | grep -q "aarch64"
      # Issue #472 (F1a): every C build carries one static assert per emitted
      # type that the C compiler's sizeof equals the layout til computed for
      # this target, so compiling is the check. test/layout_corpus.til holds
      # the awkward shapes (64-bit scalars after a byte, width aliases, own
      # fields, enum payloads) and is built here at both USize widths.
      - name: Build and run the layout corpus for linux-arm64
        run: |
          for width in 32 64; do
            ./bin/til build --target=linux-arm64 --usize=$width -o bin/layout_corpus_arm64 test/layout_corpus.til
            qemu-aarch64 -L /usr/aarch64-linux-gnu bin/layout_corpus_arm64 | grep -q "layout corpus OK"
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-arm64
        run: |
          make vendor/secp256k1/build-linux-arm64/lib/libsecp256k1.a
          ./bin/til build --target=linux-arm64 -o bin/crypto_arm64 test/crypto.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/crypto_arm64
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-arm64), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu. Before the libffi step: til itself links nng.
      - name: Cross-compile and run the nng test for linux-arm64
        run: |
          make vendor/nng/build-linux-arm64/libnng.a
          ./bin/til build --target=linux-arm64 --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-arm64 test/nng_pair.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/nng_pair_linux-arm64 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree into
      # vendor/libffi/build-linux-arm64. test/ffi_prep.til calls it directly;
      # til itself, cross-built, links it for the interpreter's ext_func
      # dispatch, so til can interpret programs ON this host.
      - name: Cross-compile and run libffi programs for linux-arm64
        run: |
          make vendor/libffi/build-linux-arm64/.libs/libffi.a
          ./bin/til build --target=linux-arm64 -o bin/ffi_prep_arm64 test/ffi_prep.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/ffi_prep_arm64 | grep -q "ffi_prep ok"
          ./bin/til build --target=linux-arm64 -o bin/til_arm64 src/til.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/til_arm64 interpret examples/hello_script.til | grep -q "Hello World"
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/til_arm64 interpret test/ext_libc.til
      # Issue #420: the GUI cross-link for this target. raylib compiles
      # against the vendored X11 headers and GLFW dlopens libX11 on the
      # device, so the distro cross gcc is all it needs. Build + file
      # check only, like the arm32 gui step: running it would need arm64
      # X11 userspace, and the gui runtime path is exercised by the
      # linux-x86 qemu+xvfb smoke.
      - name: Cross-compile a GUI example for linux-arm64
        run: |
          make vendor/raylib/build-linux-arm64/libraylib.a vendor/tinyfiledialogs/build-linux-arm64/libtinyfd.a
          ./bin/til build --target=linux-arm64 -o bin/hello_gui_arm64 examples/hello_gui.til
          file bin/hello_gui_arm64 | grep -q "aarch64"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-riscv64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri gcc-riscv64-linux-gnu qemu-user cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc riscv64-linux-gnu-gcc riscv64-linux-gnu-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for linux-riscv64
        run: |
          ./bin/til build --target=linux-riscv64 -o bin/hello_script_riscv64 examples/hello_script.til
          file bin/hello_script_riscv64 | grep -q "RISC-V"
      # Issue #472 (F1a): see the linux-arm64 job.
      - name: Build and run the layout corpus for linux-riscv64
        run: |
          for width in 32 64; do
            ./bin/til build --target=linux-riscv64 --usize=$width -o bin/layout_corpus_riscv64 test/layout_corpus.til
            qemu-riscv64 -L /usr/riscv64-linux-gnu bin/layout_corpus_riscv64 | grep -q "layout corpus OK"
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-riscv64
        run: |
          make vendor/secp256k1/build-linux-riscv64/lib/libsecp256k1.a
          ./bin/til build --target=linux-riscv64 -o bin/crypto_riscv64 test/crypto.til
          qemu-riscv64 -L /usr/riscv64-linux-gnu bin/crypto_riscv64
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-riscv64), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu. Before the libffi step: til itself links nng.
      - name: Cross-compile and run the nng test for linux-riscv64
        run: |
          make vendor/nng/build-linux-riscv64/libnng.a
          ./bin/til build --target=linux-riscv64 --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-riscv64 test/nng_pair.til
          qemu-riscv64 -L /usr/riscv64-linux-gnu bin/nng_pair_linux-riscv64 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree into
      # vendor/libffi/build-linux-riscv64. test/ffi_prep.til calls it directly;
      # til itself, cross-built, links it for the interpreter's ext_func
      # dispatch, so til can interpret programs ON this host.
      - name: Cross-compile and run libffi programs for linux-riscv64
        run: |
          make vendor/libffi/build-linux-riscv64/.libs/libffi.a
          ./bin/til build --target=linux-riscv64 -o bin/ffi_prep_riscv64 test/ffi_prep.til
          qemu-riscv64 -L /usr/riscv64-linux-gnu bin/ffi_prep_riscv64 | grep -q "ffi_prep ok"
          ./bin/til build --target=linux-riscv64 -o bin/til_riscv64 src/til.til
          qemu-riscv64 -L /usr/riscv64-linux-gnu bin/til_riscv64 interpret examples/hello_script.til | grep -q "Hello World"
          qemu-riscv64 -L /usr/riscv64-linux-gnu bin/til_riscv64 interpret test/ext_libc.til
      # Issue #420: the GUI cross-link for this target. raylib compiles
      # against the vendored X11 headers and GLFW dlopens libX11 on the
      # device, so the distro cross gcc is all it needs. Build + file
      # check only, like the arm32 gui step: running it would need riscv64
      # X11 userspace, and the gui runtime path is exercised by the
      # linux-x86 qemu+xvfb smoke.
      - name: Cross-compile a GUI example for linux-riscv64
        run: |
          make vendor/raylib/build-linux-riscv64/libraylib.a vendor/tinyfiledialogs/build-linux-riscv64/libtinyfd.a
          ./bin/til build --target=linux-riscv64 -o bin/hello_gui_riscv64 examples/hello_gui.til
          file bin/hello_gui_riscv64 | grep -q "RISC-V"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-x86:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri gcc-multilib qemu-user
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile and run for linux-x86
        run: |
          ./bin/til build --target=linux-x86 -o bin/hello_script_x86 examples/hello_script.til
          file bin/hello_script_x86 | grep -q -E "Intel (80386|i386)"
          qemu-i386 bin/hello_script_x86
          qemu-i386 bin/hello_script_x86 | grep -q "Hello World"
      # Issue #472 (F1a): see the linux-arm64 job. This is the one target
      # where a 64-bit scalar aligns to 4.
      - name: Build and run the layout corpus for linux-x86
        run: |
          for width in 32 64; do
            ./bin/til build --target=linux-x86 --usize=$width -o bin/layout_corpus_x86 test/layout_corpus.til
            qemu-i386 bin/layout_corpus_x86 | grep -q "layout corpus OK"
          done
      - name: Run Dynamic and checked byte-count probes at both USize widths
        run: |
          ./bin/til run -o bin/c/cpu_options -c gen/c/cpu_options.c test/cpu_options.til ./bin/til
          ./bin/til run -o bin/c/dynamic_widths -c gen/c/dynamic_widths.c test/dynamic_widths.til ./bin/til
          for width in 32 64; do
            ./bin/til build --target=linux-x86 --usize=$width -o tmp/dynamic_width_x86 tmp/dynamic_widths/dynamic_width.til
            qemu-i386 tmp/dynamic_width_x86 Dynamic | grep -qx "dynamic widths passed"
            ./bin/til build --target=linux-x86 --usize=$width -o tmp/dynamic_fit_x86 tmp/dynamic_widths/dynamic_fit.til
            qemu-i386 tmp/dynamic_fit_x86 | grep -qx "1"
            ./bin/til build --target=linux-x86 --usize=$width -o tmp/pointer_count_x86 tmp/dynamic_widths/pointer_count.til
            qemu-i386 tmp/pointer_count_x86 0 | grep -qx "0"
            qemu-i386 tmp/pointer_count_x86 4294967295 | grep -qx "4294967295"
            if [ "$width" = 64 ]; then
              for count in 4294967296 18446744073709551615; do
                if qemu-i386 tmp/pointer_count_x86 "$count" > tmp/pointer_count_overflow.log 2>&1; then
                  exit 1
                fi
                grep -q "usize_to_uptr: byte count exceeds pointer width" tmp/pointer_count_overflow.log
              done
            fi
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-x86
        run: |
          make vendor/secp256k1/build-linux-x86/lib/libsecp256k1.a
          ./bin/til build --target=linux-x86 -o bin/crypto_x86 test/crypto.til
          qemu-i386 bin/crypto_x86
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-x86), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu.
      - name: Cross-compile and run the nng test for linux-x86
        run: |
          make vendor/nng/build-linux-x86/libnng.a
          ./bin/til build --target=linux-x86 --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-x86 test/nng_pair.til
          qemu-i386 bin/nng_pair_linux-x86 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree into
      # vendor/libffi/build-linux-x86; test/ffi_prep.til calls it directly.
      # (til itself does not build for a 32-bit target, so no interpreter
      # run here.)
      - name: Cross-compile and run a libffi program for linux-x86
        run: |
          make vendor/libffi/build-linux-x86/.libs/libffi.a
          ./bin/til build --target=linux-x86 -o bin/ffi_prep_x86 test/ffi_prep.til
          qemu-i386 bin/ffi_prep_x86 | grep -q "ffi_prep ok"
      # Issue #232: 32-bit linux GUI. raylib compiles -m32 against the
      # vendored X11 headers and GLFW dlopens libX11 at runtime, so
      # BUILDING needs only gcc-multilib (installed above) -- no 32-bit
      # X11 sysroot. RUNNING the binary is another matter: the i386
      # process can't load the runner's 64-bit libX11, so GLFW's dlopen
      # fails and raylib segfaults windowless (run 29622850794); install
      # the i386 X11/GL runtime libs so the qemu+xvfb run opens a real
      # window. timeout 124 = alive and drawing when killed, same
      # contract as the gui suite's build tests.
      - name: Cross-compile and run a GUI example for linux-x86
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libx11-6:i386 libxrandr2:i386 libxinerama1:i386 \
            libxcursor1:i386 libxi6:i386 libxext6:i386 libgl1:i386 libgl1-mesa-dri:i386
          make vendor/raylib/build-linux-x86/libraylib.a vendor/tinyfiledialogs/build-linux-x86/libtinyfd.a
          ./bin/til build --target=linux-x86 -o bin/hello_gui_x86 examples/hello_gui.til
          file bin/hello_gui_x86 | grep -q -E "Intel (80386|i386)"
          rc=0; xvfb-run --auto-servernum timeout 3 qemu-i386 bin/hello_gui_x86 || rc=$?
          test "$rc" = "124"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-arm32:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-arm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri gcc-arm-linux-gnueabihf qemu-user
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc arm-linux-gnueabihf-gcc arm-linux-gnueabihf-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for linux-arm32
        run: |
          ./bin/til build --target=linux-arm32 -o bin/hello_script_arm32 examples/hello_script.til
          file bin/hello_script_arm32 | grep -q "ARM"
      - name: Run via qemu-arm
        run: |
          qemu-arm -L /usr/arm-linux-gnueabihf bin/hello_script_arm32
          qemu-arm -L /usr/arm-linux-gnueabihf bin/hello_script_arm32 | grep -q "Hello World"
      # Issue #472 (F1a): see the linux-arm64 job.
      - name: Build and run the layout corpus for linux-arm32
        run: |
          for width in 32 64; do
            ./bin/til build --target=linux-arm32 --usize=$width -o bin/layout_corpus_arm32 test/layout_corpus.til
            qemu-arm -L /usr/arm-linux-gnueabihf bin/layout_corpus_arm32 | grep -q "layout corpus OK"
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-arm32
        run: |
          make vendor/secp256k1/build-linux-arm32/lib/libsecp256k1.a
          ./bin/til build --target=linux-arm32 -o bin/crypto_arm32 test/crypto.til
          qemu-arm -L /usr/arm-linux-gnueabihf bin/crypto_arm32
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-arm32), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu.
      - name: Cross-compile and run the nng test for linux-arm32
        run: |
          make vendor/nng/build-linux-arm32/libnng.a
          ./bin/til build --target=linux-arm32 --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-arm32 test/nng_pair.til
          qemu-arm -L /usr/arm-linux-gnueabihf bin/nng_pair_linux-arm32 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree into
      # vendor/libffi/build-linux-arm32; test/ffi_prep.til calls it directly.
      # (til itself does not build for a 32-bit target, so no interpreter
      # run here.)
      - name: Cross-compile and run a libffi program for linux-arm32
        run: |
          make vendor/libffi/build-linux-arm32/.libs/libffi.a
          ./bin/til build --target=linux-arm32 -o bin/ffi_prep_arm32 test/ffi_prep.til
          qemu-arm -L /usr/arm-linux-gnueabihf bin/ffi_prep_arm32 | grep -q "ffi_prep ok"
      # Issue #232: arm32 GUI. Same recipe as linux-x86 gui (vendored X11
      # headers for the compile, GLFW dlopens libX11 on the target device
      # at runtime), with the same cross gcc the CLI step already uses.
      # Build + file check only: running it under qemu would need armhf
      # X11 userspace from ports.ubuntu.com multiarch, and the 32-bit gui
      # RUNTIME path (same codegen, same dlopen) is already exercised by
      # the linux-x86 job's qemu+xvfb smoke.
      - name: Cross-compile a GUI example for linux-arm32
        run: |
          make vendor/raylib/build-linux-arm32/libraylib.a vendor/tinyfiledialogs/build-linux-arm32/libtinyfd.a
          ./bin/til build --target=linux-arm32 -o bin/hello_gui_arm32 examples/hello_gui.til
          file bin/hello_gui_arm32 | grep -q "ARM"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  linux-riscv32:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-riscv32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri qemu-user bzip2
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Download Bootlin riscv32 toolchain
        run: |
          curl -sL https://toolchains.bootlin.com/downloads/releases/toolchains/riscv32-ilp32d/tarballs/riscv32-ilp32d--glibc--bleeding-edge-2024.02-1.tar.bz2 \
            -o /tmp/riscv32-toolchain.tar.bz2
          mkdir -p /tmp/riscv32-tc
          tar -xjf /tmp/riscv32-toolchain.tar.bz2 -C /tmp/riscv32-tc
          TC_DIR=$(ls -d /tmp/riscv32-tc/riscv32*)
          # Bootlin SDKs bake in their build-time path; relocate-sdk.sh
          # rewrites all internal paths for the new extraction location.
          # Without it gcc fails to find its sub-tools/sysroot.
          "$TC_DIR/relocate-sdk.sh"
          echo "RISCV32_TC=$TC_DIR" >> $GITHUB_ENV
          echo "Toolchain: $TC_DIR"
      - name: Record the C toolchain
        run: |
          for tool in gcc "$RISCV32_TC"/bin/riscv32-*-gcc "$RISCV32_TC"/bin/riscv32-*-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile and run for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/hello_script_riscv32 examples/hello_script.til
          file bin/hello_script_riscv32 | grep -q "RISC-V"
          SYSROOT=$("$RISCV32_CC" -print-sysroot)
          qemu-riscv32 -L "$SYSROOT" bin/hello_script_riscv32
          qemu-riscv32 -L "$SYSROOT" bin/hello_script_riscv32 | grep -q "Hello World"
      # Issue #472 (F1a): see the linux-arm64 job.
      - name: Build and run the layout corpus for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          SYSROOT=$("$RISCV32_CC" -print-sysroot)
          for width in 32 64; do
            ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" --usize=$width \
              -o bin/layout_corpus_riscv32 test/layout_corpus.til
            qemu-riscv32 -L "$SYSROOT" bin/layout_corpus_riscv32 | grep -q "layout corpus OK"
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds (with the Bootlin compiler) from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" vendor/secp256k1/build-linux-riscv32/lib/libsecp256k1.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/crypto_riscv32 test/crypto.til
          SYSROOT=$("$RISCV32_CC" -print-sysroot)
          qemu-riscv32 -L "$SYSROOT" bin/crypto_riscv32
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-riscv32), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu.
      - name: Cross-compile and run the nng test for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" vendor/nng/build-linux-riscv32/libnng.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-riscv32 test/nng_pair.til
          qemu-riscv32 -L "$("$RISCV32_CC" -print-sysroot)" bin/nng_pair_linux-riscv32 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree (with the
      # Bootlin compiler and binutils) into vendor/libffi/build-linux-riscv32;
      # test/ffi_prep.til calls it directly. (til itself does not build for
      # a 32-bit target, so no interpreter run here.)
      - name: Cross-compile and run a libffi program for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" vendor/libffi/build-linux-riscv32/.libs/libffi.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/ffi_prep_riscv32 test/ffi_prep.til
          SYSROOT=$("$RISCV32_CC" -print-sysroot)
          qemu-riscv32 -L "$SYSROOT" bin/ffi_prep_riscv32 | grep -q "ffi_prep ok"
      # Issue #232: riscv32 GUI, same shape as the arm32 gui step. No
      # distro ships a riscv32 gcc, so the raylib/tinyfd recipes take the
      # Bootlin compiler as RISCV32_CC. Build + file check only (no
      # riscv32 X11 userspace exists to run against; the 32-bit gui
      # runtime path is covered by the linux-x86 qemu smoke).
      - name: Cross-compile a GUI example for linux-riscv32
        run: |
          RISCV32_CC=$(ls "$RISCV32_TC"/bin/riscv32-*-gcc | head -1)
          make RISCV32_CC="$RISCV32_CC" \
            vendor/raylib/build-linux-riscv32/libraylib.a vendor/tinyfiledialogs/build-linux-riscv32/libtinyfd.a
          ./bin/til build --target=linux-riscv32 --cc="$RISCV32_CC" \
            -o bin/hello_gui_riscv32 examples/hello_gui.til
          file bin/hello_gui_riscv32 | grep -q "RISC-V"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #424: wasm32 through the vendored emsdk. A non-gui program is a
  # single .js (wasm embedded) run under node; a mode gui program is a
  # single .html page. make installs the emsdk on the way to the wasm32
  # libsecp256k1 archive, so test/crypto.til -- the SHA-256 and BIP-340
  # vectors -- runs here as wasm too.
  wasm32:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: wasm32 (emscripten, run under node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Build bin/til (native)
        run: make
      - name: Install the vendored emsdk and the wasm32 libsecp256k1
        run: make vendor/secp256k1/build-wasm32/lib/libsecp256k1.a vendor/raylib/build-wasm32/libraylib.a
      - name: Record the C toolchain
        run: |
          export EM_CONFIG=$PWD/vendor/emscripten/.emscripten
          for tool in gcc "$PWD/vendor/emscripten/upstream/emscripten/emcc"; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run wasm32 programs
        run: |
          export EM_CONFIG=$PWD/vendor/emscripten/.emscripten
          EMCC=$PWD/vendor/emscripten/upstream/emscripten/emcc
          NODE=$(ls vendor/emscripten/node/*/bin/node | head -1)
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/hello_script.js examples/hello_script.til
          "$NODE" bin/hello_script.js | grep -q "Hello World"
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/crypto.js test/crypto.til
          "$NODE" bin/crypto.js
          # Issue #472 (F1a): the layout corpus; see the linux-arm64 job.
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/layout_corpus.js test/layout_corpus.til
          "$NODE" bin/layout_corpus.js | grep -q "layout corpus OK"
          ./bin/til build --target=wasm32 --cc="$EMCC" -o bin/hello_gui.html examples/hello_gui.til
          grep -qi "<html" bin/hello_gui.html
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  windows-x64-build:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: windows-x64/x86 (cross-compile on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri mingw-w64 cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc x86_64-w64-mingw32-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for windows-x64 and windows-x86
        run: |
          ./bin/til build --target=windows-x64 -o bin/hello_script.exe examples/hello_script.til
          file bin/hello_script.exe | grep -q "PE32+"
          # windows-x86 (32-bit, mingw i686) -- issue #232
          ./bin/til build --target=windows-x86 -o bin/hello_script-x86.exe examples/hello_script.til
          file bin/hello_script-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #472 (F1a): see the linux-arm64 job. Build only: the asserts
      # are checked by the compiler, and this file is not in the artifact
      # the windows runner executes.
      - name: Build the layout corpus for windows-x64 and windows-x86
        run: |
          for width in 32 64; do
            ./bin/til build --target=windows-x64 --usize=$width -o bin/layout_corpus.exe test/layout_corpus.til
            ./bin/til build --target=windows-x86 --usize=$width -o bin/layout_corpus-x86.exe test/layout_corpus.til
          done
      # Issue #232: prove mode gui cross-links for BOTH windows arches. mingw
      # ships the win32/win64 GL/GDI backend, so raylib/tinyfd cross-build
      # from source with no X11 sysroot. Build-only (a raylib window cannot
      # open on a headless runner) -- the file-format check is the proof, the
      # same shape as the mac gui-cross job.
      - name: Cross-compile a GUI example for windows-x64 and windows-x86
        run: |
          make vendor/raylib/build-windows-x64/libraylib.a vendor/tinyfiledialogs/build-windows-x64/libtinyfd.a
          make vendor/raylib/build-windows-x86/libraylib.a vendor/tinyfiledialogs/build-windows-x86/libtinyfd.a
          ./bin/til build --target=windows-x64 -o bin/hello_gui.exe examples/hello_gui.til
          file bin/hello_gui.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/hello_gui-x86.exe examples/hello_gui.til
          file bin/hello_gui-x86.exe | grep -q -E "Intel (80386|i386)"
          # The retained editor example covers a larger GUI app than the smoke
          # example. Full editor development now lives in jtimon/tiled.
          ./bin/til build --target=windows-x64 -o bin/editor.exe examples/editor.til
          file bin/editor.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/editor-x86.exe examples/editor.til
          file bin/editor-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #235: std/crypto on windows. libsecp256k1 cross-builds from
      # the vendored source for both arches (mingw is the whole toolchain
      # change; no shims, unlike nng), and test/crypto.til -- the FIPS
      # 180-4 SHA-256 and BIP-340 vectors through the std wrapper -- links
      # against those archives and RUNS on the windows runner below.
      - name: Cross-compile the std/crypto test for windows-x64 and windows-x86
        run: |
          make vendor/secp256k1/build-windows-x64/lib/libsecp256k1.a vendor/secp256k1/build-windows-x86/lib/libsecp256k1.a
          ./bin/til build --target=windows-x64 -o bin/crypto.exe test/crypto.til
          file bin/crypto.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/crypto-x86.exe test/crypto.til
          file bin/crypto-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #420: both mingw libffi archives, called directly by
      # test/ffi_prep.til (the win64 one is otherwise only exercised through
      # til.exe's interpreter, the win32 one not at all); the programs run
      # on the windows runner below.
      - name: Cross-compile the libffi test for windows-x64 and windows-x86
        run: |
          make vendor/libffi/build-windows-x64/.libs/libffi.a vendor/libffi/build-windows-x86/.libs/libffi.a
          ./bin/til build --target=windows-x64 -o bin/ffi_prep.exe test/ffi_prep.til
          file bin/ffi_prep.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 -o bin/ffi_prep-x86.exe test/ffi_prep.til
          file bin/ffi_prep-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #422: nng for both windows arches, from make.til's per-target
      # table; test/nng_pair.til (a one-process round trip over inproc://)
      # runs on the windows runner below.
      - name: Cross-compile the nng test for windows-x64 and windows-x86
        run: |
          make vendor/nng/build-windows-x64/libnng.a vendor/nng/build-windows-x86/libnng.a
          ./bin/til build --target=windows-x64 --extra-modes=examples/custom_modes.til -o bin/nng_pair.exe test/nng_pair.til
          file bin/nng_pair.exe | grep -q "PE32+"
          ./bin/til build --target=windows-x86 --extra-modes=examples/custom_modes.til -o bin/nng_pair-x86.exe test/nng_pair.til
          file bin/nng_pair-x86.exe | grep -q -E "Intel (80386|i386)"
      # Issue #473 (C1): every file of the upload below, by name. The upload
      # action accepts a list with a member missing, and the runner would
      # then test a partial set. Keep this list and the upload's the same.
      - name: Check the .exe artifact is complete
        run: |
          status=0
          for f in hello_script crypto ffi_prep nng_pair; do
            for e in "$f.exe" "$f-x86.exe"; do
              if [ ! -f "bin/$e" ] || [ ! -s "bin/$e" ]; then
                echo "missing or empty: bin/$e"; status=1
              fi
            done
          done
          exit $status
      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_script-windows
          if-no-files-found: error
          path: |
            bin/hello_script.exe
            bin/hello_script-x86.exe
            bin/crypto.exe
            bin/crypto-x86.exe
            bin/ffi_prep.exe
            bin/ffi_prep-x86.exe
            bin/nng_pair.exe
            bin/nng_pair-x86.exe
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  windows-x64-run:
    name: windows-x64/x86 (run .exe on windows)
    needs: windows-x64-build
    runs-on: windows-latest
    steps:
      - name: Download .exe artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello_script-windows
      # Issue #473 (C1): the eight files windows-x64-build uploads, before
      # any of them runs.
      - name: Check the downloaded .exe artifact is complete
        shell: bash
        run: |
          status=0
          for f in hello_script crypto ffi_prep nng_pair; do
            for e in "$f.exe" "$f-x86.exe"; do
              if [ ! -f "$e" ] || [ ! -s "$e" ]; then
                echo "missing or empty: $e"; status=1
              fi
            done
          done
          exit $status
      - name: Run .exe (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./hello_script.exe
          ./hello_script.exe | grep -q "Hello World"
          ./hello_script-x86.exe
          ./hello_script-x86.exe | grep -q "Hello World"
      # Issue #235: a failing vector panics and exits nonzero, which fails
      # the step; the pass lines are in the log for reading.
      - name: Run the std/crypto test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./crypto.exe
          ./crypto-x86.exe
      - name: Run the libffi test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./ffi_prep.exe | grep -q "ffi_prep ok"
          ./ffi_prep-x86.exe | grep -q "ffi_prep ok"
      - name: Run the nng test (x64 + x86 via WOW64)
        shell: bash
        run: |
          ./nng_pair.exe | grep -q "nng pair ok"
          ./nng_pair-x86.exe | grep -q "nng pair ok"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #25: til itself running on a windows HOST. bin/til.exe is the
  # compiler cross-built for windows (build_win_host) on linux, then run
  # on a real windows runner: `til.exe interpret` and `til.exe translate`
  # prove the interpreter and codegen run natively on windows -- neither
  # needs a C toolchain, and the win64 libffi is statically linked so
  # ext_func dispatch works. sender.exe is the nng mode-server example,
  # cross-built against the win64 nng (msvcrt, with ext.c's timespec_get
  # shim -- never the UCRT, see examples/lib/custom_modes/nng_base.til); running it
  # here proves nng works on real winsock -- wine's winsock is incomplete
  # and cannot, so this job IS the nng-on-windows proof.
  windows-x64-host-build:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: windows-x64 host (cross-build til.exe + nng on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri mingw-w64 cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc x86_64-w64-mingw32-gcc x86_64-w64-mingw32-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-build til.exe (windows host compiler) and nng server
        run: |
          make build_win_host win_server
          file bin/til.exe | grep -q "PE32+"
          file bin/sender.exe | grep -q "PE32+"
          file bin/receiver.exe | grep -q "PE32+"
      # Issue #349: the Cmd quoting round trip, cross-built here and
      # EXECUTED on the real windows runner below -- the only place
      # win_quote_arg / CreateProcessA / win_env_block ever run (the
      # linux leg of the same pair is the suite's win_quoting test).
      - name: Cross-build the Cmd quoting round trip
        run: |
          ./bin/til build --target=windows-x64 -o bin/echo_argv.exe test/echo_argv.til
          ./bin/til build --target=windows-x64 -o bin/win_quoting.exe test/win_quoting.til
          file bin/echo_argv.exe | grep -q "PE32+"
          file bin/win_quoting.exe | grep -q "PE32+"
      # Issue #347: the REPL console driver, cross-built here and RUN on
      # the windows runner below -- the only place the repl_term_* windows
      # block has ever executed. test/wincon.c rides along through
      # link_c(), so this also keeps that file compiling under mingw's
      # -Wall -Wextra -Werror.
      - name: Cross-build the REPL console driver
        run: |
          ./bin/til build --target=windows-x64 -o bin/repl_wincon.exe test/repl_wincon.til
          file bin/repl_wincon.exe | grep -q "PE32+"
      # Issue #473 (C2): every file of the four uploads below, by name, as
      # in windows-x64-build. Keep this list and the uploads' the same.
      - name: Check the windows-host artifacts are complete
        run: |
          status=0
          for f in \
            bin/til.exe bin/sender.exe bin/receiver.exe \
            bin/echo_argv.exe bin/win_quoting.exe bin/repl_wincon.exe \
            vendor/secp256k1/build-windows-x64/lib/libsecp256k1.dll \
            vendor/secp256k1/build-windows-x64/lib/libsecp256k1.a \
            vendor/raylib/build-windows-x64/libraylib.dll \
            vendor/raylib/build-windows-x64/libraylib.a \
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.dll \
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.a \
            vendor/nng/build-windows-x64/libnng.dll \
            vendor/nng/build-windows-x64/libnng.a; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "missing or empty: $f"; status=1
            fi
          done
          exit $status
      - name: Upload windows-host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: til-windows-host
          if-no-files-found: error
          path: |
            bin/til.exe
            bin/sender.exe
            bin/receiver.exe
            bin/echo_argv.exe
            bin/win_quoting.exe
            bin/repl_wincon.exe
      # Issue #235: what til.exe's interpreter loads for a program
      # importing std/crypto -- the DLL twin build_win_host made from the
      # windows-x64 archive -- plus that archive, which std/crypto's
      # windows-x64 link() names (issue #422). Its own artifact: mixed
      # directories in the one above would move bin/til.exe off the path
      # every step uses.
      - name: Upload the windows-host libsecp256k1
        uses: actions/upload-artifact@v4
        with:
          name: secp256k1-windows-host
          if-no-files-found: error
          path: |
            vendor/secp256k1/build-windows-x64/lib/libsecp256k1.dll
            vendor/secp256k1/build-windows-x64/lib/libsecp256k1.a
      # Issue #420: the same for mode gui -- the raylib and tinyfd DLL
      # twins build_win_host made, beside the windows-x64 archives
      # src/modes/gui.til links for a windows host (issue #422).
      - name: Upload the windows-host gui libraries
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-host
          if-no-files-found: error
          path: |
            vendor/raylib/build-windows-x64/libraylib.dll
            vendor/raylib/build-windows-x64/libraylib.a
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.dll
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.a
      # Issue #482: the same for a program that links nng. til.exe builds
      # it against the windows-x64 archive, and interprets it through the
      # DLL twin build_win_host made beside that archive.
      - name: Upload the windows-host nng
        uses: actions/upload-artifact@v4
        with:
          name: nng-windows-host
          if-no-files-found: error
          path: |
            vendor/nng/build-windows-x64/libnng.dll
            vendor/nng/build-windows-x64/libnng.a
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  windows-x64-host-run:
    name: windows-x64 host (run til.exe + nng on windows)
    needs: windows-x64-host-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download windows-host artifacts
        uses: actions/download-artifact@v4
        with:
          name: til-windows-host
          path: winhost
      # Issue #473 (C2): the six files windows-x64-host-build uploads under
      # this name, before any of them runs.
      - name: Check the downloaded windows-host artifacts are complete
        shell: bash
        run: |
          status=0
          for f in til sender receiver echo_argv win_quoting repl_wincon; do
            if [ ! -f "winhost/$f.exe" ] || [ ! -s "winhost/$f.exe" ]; then
              echo "missing or empty: winhost/$f.exe"; status=1
            fi
          done
          exit $status
      - name: Interpret and translate on windows
        shell: bash
        run: |
          ./winhost/til.exe interpret examples/hello_script.til
          ./winhost/til.exe interpret examples/hello_script.til | grep -q "Hello World"
          ./winhost/til.exe translate -c tmp_hello.c examples/hello_script.til
          test -s tmp_hello.c
      # Issue #483: copy_file's Win32 branch (a sibling temporary, then
      # MoveFileExA over the destination) executes nowhere else.
      - name: Interpret the copy_file test on windows
        shell: bash
        run: |
          ./winhost/til.exe interpret test/copy_file.til
      # Issue #472 (F4): generated source is compared between hosts, so a
      # windows-hosted compiler has to bake file names the way the others
      # do: ./src/... for the compiler's own tree, the path as written for
      # the program, forward slashes, never a drive or an absolute path.
      # The grep -o lines show what was baked before anything is judged.
      - name: Check the source paths til.exe bakes
        shell: bash
        run: |
          ./winhost/til.exe translate -c tmp_copy_file.c test/copy_file.til
          grep -o '"[^"]*\.til:[0-9]*:[0-9]*' tmp_copy_file.c | sed 's/:[0-9]*:[0-9]*$//' | sort | uniq -c
          grep -q '"\./src/core/[a-z_]*\.til:' tmp_copy_file.c
          grep -q '"\./src/std/[a-z_]*\.til:' tmp_copy_file.c
          grep -q '"test/copy_file\.til:' tmp_copy_file.c
          if grep -E '"([A-Za-z]:|/)[^"]*\.til:[0-9]' tmp_copy_file.c; then
            echo "an absolute source path is baked into the generated C"; exit 1
          fi
          if grep -F '\\' tmp_copy_file.c | grep -E '\.til:[0-9]'; then
            echo "a backslash source path is baked into the generated C"; exit 1
          fi
      # Issue #472 (F6): what til.exe writes for the floats it folds, held
      # to the spellings the suite's "float_fold" row pins on the hosts that
      # run the suite. til.exe runs no suite, and its finite values go
      # through this C library's printf. Run 3051 showed every one of them
      # equal to Linux's, so they are required here; the lines are printed
      # first so a difference shows what was written.
      - name: Check how til.exe spells folded floats
        shell: bash
        run: |
          ./winhost/til.exe translate -c tmp_float_fold.c test/float_fold.til
          grep -E 'hoisted__F(32|64)_g[0-9]+ = |TIL_OWN_LIT\("[-+.#0-9A-Za-z]+", ' tmp_float_fold.c
          status=0
          while IFS= read -r needle; do
            count=$(grep -c -F -- "$needle" tmp_float_fold.c || true)
            if [ "$count" != 1 ]; then
              echo "expected once, found $count times: $needle"; status=1
            fi
          done <<'NEEDLES'
          = 0.10000000000000001;
          = 0.333333343;
          = 1.0000000000000001e+305;
          = 9.9999999999999694e-311;
          = -0.0;
          = 9007199254740992;
          = __builtin_inf();
          = (-__builtin_inf());
          = __builtin_nan("");
          TIL_OWN_LIT("1e+40", 5ULL)
          TIL_OWN_LIT("1e-310", 6ULL)
          TIL_OWN_LIT("0.333333", 8ULL)
          TIL_OWN_LIT("-0", 2ULL)
          TIL_OWN_LIT("-inf", 4ULL)
          TIL_OWN_LIT("nan", 3ULL)
          NEEDLES
          exit $status
      # Both files share one directory, which becomes the artifact's root.
      - name: Download the windows-host libsecp256k1
        uses: actions/download-artifact@v4
        with:
          name: secp256k1-windows-host
          path: vendor/secp256k1/build-windows-x64/lib
      - name: Check the downloaded libsecp256k1 is complete
        shell: bash
        run: |
          status=0
          for f in libsecp256k1.dll libsecp256k1.a; do
            p="vendor/secp256k1/build-windows-x64/lib/$f"
            if [ ! -f "$p" ] || [ ! -s "$p" ]; then
              echo "missing or empty: $p"; status=1
            fi
          done
          exit $status
      # Issue #235: interpret std/crypto ON windows. The interpreter loads
      # the twin beside the archive the program's link() resolves to for
      # the host (ffi_load_archive_twin: libsecp256k1.a -> libsecp256k1.dll
      # on a windows host): the windows-x64 one, where the artifact
      # landed. A failing vector panics and fails the step.
      - name: Interpret the std/crypto test on windows
        shell: bash
        run: |
          ./winhost/til.exe interpret test/crypto.til
      - name: Download the windows-host gui libraries
        uses: actions/download-artifact@v4
        with:
          name: gui-windows-host
          path: vendor
      - name: Check the downloaded gui libraries are complete
        shell: bash
        run: |
          status=0
          for f in \
            vendor/raylib/build-windows-x64/libraylib.dll \
            vendor/raylib/build-windows-x64/libraylib.a \
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.dll \
            vendor/tinyfiledialogs/build-windows-x64/libtinyfd.a; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "missing or empty: $f"; status=1
            fi
          done
          exit $status
      # Issue #420: interpret mode gui ON windows. test/gui_interp.til is
      # windowless (pure-CPU raylib calls through libffi: scalar and
      # by-value struct arguments, Bool returns, string arguments), so it
      # needs the DLL twins but no display. Same layout as std/crypto
      # above: the windows-x64 archives where gui.til's link()s name them,
      # the DLLs beside them. The test panics on any wrong answer.
      - name: Interpret the windowless gui test on windows
        shell: bash
        run: |
          ./winhost/til.exe interpret test/gui_interp.til
      # Issue #349: first-ever execution of Cmd's windows side. The
      # driver spawns echo_argv.exe THROUGH Cmd (win_quote_arg's
      # CommandLineToArgvW rules, the CreateProcessA command line,
      # win_env_block's case-insensitive override, GetTempPath capture
      # spools) and compares what the child's CRT parsed against what
      # was passed. TIL_QUOTE_CASE feeds the displacement probe.
      - name: Cmd quoting round trip on windows
        shell: bash
        env:
          TIL_QUOTE_CASE: parent
        run: |
          cd winhost
          ./win_quoting.exe echo_argv.exe
          ./win_quoting.exe echo_argv.exe | grep -q "win_quoting PASS"
      # Issue #347: first-ever execution of the REPL's windows console
      # half. The driver allocates a real console (the runner gives the
      # job pipes, which repl_term_is_interactive correctly refuses), spawns
      # til.exe repl into it, posts key records with WriteConsoleInput and
      # reads the drawn rows back with ReadConsoleOutputCharacter -- the
      # console analogue of the pty test/repl_pty.til drives on POSIX.
      # Run from winhost/ and name the child as a BARE til.exe, like the
      # quoting step above: CreateProcess resolves that from the calling
      # image's directory, while a forward-slash relative path is not a
      # spelling it is documented to search. til.exe finds its own support
      # tree through GetModuleFileNameA, not through the cwd, so the REPL
      # still resolves src/ and boot/ from here.
      - name: REPL console session on windows
        shell: bash
        # Belt to the driver's own per-wait budget: the console is the
        # child's, so a driver that blocks says NOTHING until it is killed,
        # and the job default is six hours. Ten minutes is above the
        # driver's own worst case (every wait timing out in sequence).
        timeout-minutes: 10
        run: |
          cd winhost
          mkdir -p tmp
          ./repl_wincon.exe til.exe | tee repl_wincon.out
          grep -q "repl_wincon PASS" repl_wincon.out
      - name: Run nng sender+receiver over real winsock on windows
        shell: bash
        run: |
          # Prove nng works on a REAL windows host, which wine cannot (its
          # winsock is incomplete -- listen returns "Not supported"). sender
          # listens on tcp://127.0.0.1:5555 and sends one message, then
          # closes; receiver dials, receives (3s recv-timeout so it can
          # never hang), and prints it. sender's nng_send blocks until a
          # peer takes the message, so run sender in the background and let
          # receiver drive the exchange -- running sender alone would hang.
          ./winhost/sender.exe > sender.out 2>&1 &
          spid=$!
          sleep 3
          ./winhost/receiver.exe | tee receiver.out
          # receiver has finished (or hit its 3s recv-timeout). If the
          # exchange failed, sender is still blocked in nng_send, so reap
          # it rather than wait on it -- the step must never hang.
          kill "$spid" 2>/dev/null || true
          wait "$spid" 2>/dev/null || true
          echo "--- sender output ---"; cat sender.out
          grep -q "nng version" receiver.out
          grep -q "received: hello from til over nng" receiver.out
      # Both files share one directory, which becomes the artifact's root.
      - name: Download the windows-host nng
        uses: actions/download-artifact@v4
        with:
          name: nng-windows-host
          path: vendor/nng/build-windows-x64
      - name: Check the downloaded nng is complete
        shell: bash
        run: |
          status=0
          for f in libnng.dll libnng.a; do
            p="vendor/nng/build-windows-x64/$f"
            if [ ! -f "$p" ] || [ ! -s "$p" ]; then
              echo "missing or empty: $p"; status=1
            fi
          done
          exit $status
      # Full compiler on windows: til.exe BUILDS (compiles + links) a
      # program natively, the last host capability beyond interpret/
      # translate. It needs a C toolchain -- `til.exe build` invokes
      # `gcc` (toolchain_command picks plain gcc on a windows host), so
      # ensure mingw's gcc is present. get_bin_dir walks up from
      # winhost/ to the checkout root, so src/self/codegen/ext.c and boot/ resolve
      # there; hello_script uses no runtime ext_func, so no libffi.
      - name: Build programs and check link_c isolation on windows
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw -y --no-progress >/dev/null
          fi
          if ! command -v gcc >/dev/null 2>&1; then
            gcc_exe=$(find /c/ProgramData/chocolatey/lib/mingw /c/ProgramData/mingw64 /c/mingw64 -name gcc.exe 2>/dev/null | head -1)
            export PATH="$(dirname "$gcc_exe"):$PATH"
          fi
          gcc --version
          ./winhost/til.exe build -o hello_native.exe examples/hello_script.til
          ./hello_native.exe
          ./hello_native.exe | grep -q "Hello World"
          # Execute the regression with the Windows compiler and native GCC,
          # including its compiled compiler wrapper and both linked fixtures.
          # Its last part (#482) builds and then INTERPRETS a program that
          # links nng and a link_c bridge: the archive and its DLL twin from
          # the step above, and for the interpreted bridge the dlltool that
          # comes with gcc (interpreter.til, ffi_init_user_so).
          dlltool --version | head -1
          # Which C runtime this gcc links by default. The nng archive is
          # built against msvcrt (make.til's NngTarget), and nothing else
          # links it with this compiler.
          gcc -v 2>&1 | tr ' ' '\n' | grep -- '--with-default-msvcrt' || echo "gcc -v names no default C runtime"
          mkdir -p tmp
          compiler=$(cygpath -w "$PWD/winhost/til.exe")
          if ! ./winhost/til.exe run --force-rebuild -o tmp/link_objects_driver.exe -c tmp/link_objects_driver.c test/link_objects.til "$compiler" > tmp/link_objects.out 2>&1; then
            cat tmp/link_objects.out
            exit 1
          fi
          cat tmp/link_objects.out
          grep -q "link_objects PASS" tmp/link_objects.out
      # Issue #473 (C3): this host's hash list for the collect job. til.exe
      # BUILDS the collector with the runner's gcc (interpreting it takes
      # hours); the hashes come from the sha256sum of Git for Windows, which
      # a bash step has on its PATH. A Windows process ends the lines it
      # prints with CR LF; the collector reads observations as text.
      - name: Write the hash lists for the collector
        shell: bash
        run: |
          mkdir -p tmp/hashes
          ./winhost/til.exe build -o tmp/ci_collect.exe -c tmp/ci_collect.c examples/ci_collect.til
          ./tmp/ci_collect.exe produce windows-x64 tmp/hashes/windows-x64.txt winhost/til.exe
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-windows-x64
          path: tmp/hashes/windows-x64.txt
          if-no-files-found: error
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #25 phase 1: native macOS. No continue-on-error anywhere: a
  # failed job fails the run, honestly red until the remaining darwin
  # bug is fixed. Runners are headless (no windowing session for
  # raylib), so run the no-gui suite -- same reason linux jobs need
  # xvfb. macos-latest is arm64; macos-15-intel is x64.
  #
  # The suite runs under ASAN (same as linux `make test`, minus gui):
  # the darwin frontier was heap corruption inside til itself that only
  # fired on mac-only code paths (the per-arch libffi binding bugs,
  # fixed); ASAN keeps mac honest the same way it keeps linux honest.
  #
  # Bounded -j: tests.til defaults its parallelism to the core count
  # (3-4 here), but the suite's memory does not fit that on these
  # runners -- measured on linux-x64: a small test's ASAN compile peaks
  # ~1GB and self_translate (til_asan translate src/til.til) peaks
  # 8.5GB. At default -j the OS silently SIGKILLs a random concurrent
  # process under memory pressure (empty captured stderr, no crash
  # report -- a SIGKILL leaves neither), the "churning victim" signature
  # of every mac failure since the suite went ASAN. -j2 got the roomier
  # macos-15-intel runner green (run 29149518241); the tighter arm64 M1
  # runner still lost 3 processes at -j2, so it drops to -j1. If -j1
  # still OOMs there, the single self_translate process is the ceiling
  # and the next lever is a smaller ASAN quarantine or running that one
  # test without ASAN.
  #
  # Issue #475: each push asks for ONE macos-latest and ONE macos-15-intel
  # runner. GitHub runs only a few macOS jobs of an account at once and
  # cancels a job that waits too long for one (run 3007: "The job was not
  # acquired by Runner of type hosted even after multiple attempts"), so
  # the small mac jobs live inside the native job of their architecture:
  # this one also runs the linux-cross-built arm64 binaries (the steps
  # marked "cross run") and cross-builds windows and linux from the mac
  # (the steps marked "host cross"); macos-x64 runs the x64 cross
  # binaries. Hence the `needs: macos-cross-build`: those binaries are its
  # artifacts. The cross-run steps go first -- they take seconds and need
  # no build -- so a native-suite failure cannot hide them.
  macos-arm64:
    needs: [doc-gate, macos-cross-build]
    if: needs.doc-gate.outputs.code == 'true'
    name: macos-arm64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Download mac artifacts (cross run)
        uses: actions/download-artifact@v4
        with:
          name: hello_script-macos
      - name: Run cross-built binary (cross run)
        run: |
          chmod +x hello_script-macos-arm64
          ./hello_script-macos-arm64
          ./hello_script-macos-arm64 | grep -q "Hello World"
      - name: Run the cross-built std/crypto test (cross run)
        run: |
          chmod +x crypto-macos-arm64
          ./crypto-macos-arm64
      - name: Download the mac til and libffi programs (cross run)
        uses: actions/download-artifact@v4
        with:
          name: til-macos-cross
          path: machost
      # Issue #420: the cross-built libffi on a real mac -- directly, and
      # through the cross-built til's interpreter.
      - name: Run the cross-built libffi test and til interpreter (cross run)
        run: |
          chmod +x machost/ffi_prep-macos-arm64 machost/nng_pair-macos-arm64 machost/til-macos-arm64
          ./machost/ffi_prep-macos-arm64 | grep -q "ffi_prep ok"
          ./machost/nng_pair-macos-arm64 | grep -q "nng pair ok"
          ./machost/til-macos-arm64 interpret examples/hello_script.til | grep -q "Hello World"
          ./machost/til-macos-arm64 interpret test/ext_libc.til
      - name: Record the C toolchain
        run: |
          echo "clang: $(clang --version 2>&1 | head -1)"
          echo "ld: $(ld -v 2>&1 | head -1)"
          echo "sdk: $(xcrun --show-sdk-version 2>&1 | head -1)"
      - name: Build and run tests (no gui, ASAN)
        run: |
          make bin/til bin/til_asan bin/test_runner bin/plot bin/tests
          bin/tests --no-gui --til-bin bin/til_asan --asan -j1
      - name: Test target build
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_script_macos_arm64 examples/hello_script.til
          file bin/hello_script_macos_arm64 | grep -q "Mach-O"
          ./bin/hello_script_macos_arm64
          ./bin/hello_script_macos_arm64 | grep -q "Hello World"
      # This host's JNI jar, for jni-jar-merge.
      - name: Build the JNI test jar
        run: ./bin/til build --jni test/jni_lib.til
      - name: Upload the JNI test jar
        uses: actions/upload-artifact@v4
        with:
          name: jni-jar-macos-arm64
          path: |
            gen/lib/jni_lib.jar
            gen/til/java/til/jni_lib/JniLib.java
      # Native mac GUI: build every mode-gui example (chess, go, shootil,
      # ...) against the real Apple SDK frameworks, which the SDK-less
      # cross toolchain lacks. This is the only way mac GUI can be built
      # (frameworks are not redistributable for a linux cross), so proving
      # it here IS the mac-gui deliverable (issue #25). raylib/tinyfd were
      # already built natively by the suite step above.
      - name: Build native mac examples (gui + portable)
        run: make build_mac
      # Issue #25: macOS as a HOST cross-compiling to the OTHER OSes (the
      # last two matrix cells), with the bin/til the suite step built.
      # Windows uses the brew mingw-w64 cross-gcc, which toolchain_command
      # already selects for a windows target from any non-windows host.
      # Linux uses a prebuilt cross-gcc (messense tap) via --cc, the same
      # override the riscv32 job uses. Compiled programs bind ext_func to
      # direct C symbols and never reference libffi, so no cross libffi is
      # needed. The artifacts run on real windows / linux runners
      # (macos-host-cross-win-run / -linux-run below).
      - name: Install cross toolchains (host cross)
        run: |
          brew install mingw-w64
          brew tap messense/macos-cross-toolchains
          # Homebrew's tap-trust check blocks third-party formulae until
          # the tap is explicitly trusted; the linux cross-gcc lives in
          # this tap (homebrew-core ships no linux cross-gcc).
          brew trust messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu
      - name: Cross-compile hello_script for windows-x64 (host cross)
        run: |
          ./bin/til build --target=windows-x64 -o bin/hello_script-from-mac.exe examples/hello_script.til
          file bin/hello_script-from-mac.exe | grep -q "PE32+"
      - name: Cross-compile hello_script for linux-x64 (host cross)
        run: |
          ./bin/til build --target=linux-x64 --cc=x86_64-unknown-linux-gnu-gcc \
            -o bin/hello_script-from-mac-linux examples/hello_script.til
          file bin/hello_script-from-mac-linux | grep -q "ELF 64-bit"
      # Issue #420: std/crypto for linux-x64 from a mac. The canonical
      # libsecp256k1 archive is the mac's own, so linux-x64 links its
      # cross archive, built with the same messense gcc (LINUX_X64_CC);
      # test/crypto.til -- the SHA-256 and BIP-340 vectors -- runs on the
      # linux runner below.
      - name: Cross-compile the std/crypto test for linux-x64 (host cross)
        run: |
          make LINUX_X64_CC=x86_64-unknown-linux-gnu-gcc vendor/secp256k1/build-linux-x64/lib/libsecp256k1.a
          ./bin/til build --target=linux-x64 --cc=x86_64-unknown-linux-gnu-gcc \
            -o bin/crypto-from-mac-linux test/crypto.til
          file bin/crypto-from-mac-linux | grep -q "ELF 64-bit"
      - name: Upload cross artifacts (host cross)
        uses: actions/upload-artifact@v4
        with:
          name: hello_script-from-mac
          path: |
            bin/hello_script-from-mac.exe
            bin/hello_script-from-mac-linux
            bin/crypto-from-mac-linux
      # Issue #473 (C3): this host's hash list for the collect job, as in
      # linux-x64. Hashes come from shasum here.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce macos-arm64 tmp/hashes/macos-arm64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-macos-arm64
          path: tmp/hashes/macos-arm64.txt
          if-no-files-found: error
      # Guard Malloc puts every allocation on its own guarded page, so
      # an out-of-bounds or use-after-free write faults AT THE CULPRIT
      # INSTRUCTION (even from uninstrumented code like libffi asm) and
      # its crash report names the writer -- the backup net for whatever
      # ASAN cannot see. test/loops.til is a compile that has crashed
      # on these runners before; til_boot is the fallback when the
      # crash happened before bin/til was built.
      - name: Guard Malloc probe
        if: failure()
        timeout-minutes: 45
        run: |
          if [ -x bin/til ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til translate -c tmp/gm_probe.c test/loops.til || true
          elif [ -x bin/til_boot ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til_boot translate -c tmp/gm_probe.c test/loops.til || true
          fi
      # macOS crash reasons land in .ips crash reports, not stderr.
      # ReportCrash writes them asynchronously -- sometimes well past
      # 10s, occasionally to the system directory -- hence the long
      # sleep and both dirs (a 10s single-dir version missed every
      # report in runs 29027527473/x64 and 29045082029/arm64). Print a
      # COMPACT digest (procName + exception + faulting-thread frames)
      # instead of raw cats: full macOS-26 .ips files are >5000 lines
      # each and bury everything else past the log API's tail window
      # (run 29050250037). The full reports still go into the artifact
      # together with the binaries they reference (issue #25).
      - name: Dump crash reports
        if: failure()
        run: |
          sleep 30
          ls -l ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          mkdir -p tmp/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          sudo cp /Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          cp bin/til bin/til_boot tmp/crash/ 2>/dev/null || true
          python3 - <<'EOF'
          import glob, json
          for p in sorted(glob.glob('tmp/crash/*.ips')):
              print('=== digest:', p)
              try:
                  raw = open(p).read()
                  body = json.loads(raw[raw.index('\n'):])
                  for k in ('procName', 'parentProc', 'exception', 'termination', 'asi'):
                      if k in body: print(k, ':', json.dumps(body[k]))
                  t = body['threads'][body.get('faultingThread', 0)]
                  for f in t.get('frames', []):
                      src = f.get('sourceFile', '')
                      line = f.get('sourceLine', '')
                      loc = ' {}:{}'.format(src, line) if src else ''
                      print('  frame img={} off={} {}{}'.format(
                          f.get('imageIndex'), f.get('imageOffset'),
                          f.get('symbol', '?'), loc))
              except Exception as e:
                  print('  digest failed:', e)
          EOF
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-macos-arm64
          path: tmp/crash/
          if-no-files-found: ignore
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Also runs the linux-cross-built x64 binaries (issue #475; see the
  # macos-arm64 job).
  macos-x64:
    needs: [doc-gate, macos-cross-build]
    if: needs.doc-gate.outputs.code == 'true'
    name: macos-x64 (native)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Download mac artifacts (cross run)
        uses: actions/download-artifact@v4
        with:
          name: hello_script-macos
      - name: Run cross-built binary (cross run)
        run: |
          chmod +x hello_script-macos-x64
          ./hello_script-macos-x64
          ./hello_script-macos-x64 | grep -q "Hello World"
      - name: Run the cross-built std/crypto test (cross run)
        run: |
          chmod +x crypto-macos-x64
          ./crypto-macos-x64
      - name: Download the mac til and libffi programs (cross run)
        uses: actions/download-artifact@v4
        with:
          name: til-macos-cross
          path: machost
      # Issue #420: the cross-built libffi on a real mac -- directly, and
      # through the cross-built til's interpreter.
      - name: Run the cross-built libffi test and til interpreter (cross run)
        run: |
          chmod +x machost/ffi_prep-macos-x64 machost/nng_pair-macos-x64 machost/til-macos-x64
          ./machost/ffi_prep-macos-x64 | grep -q "ffi_prep ok"
          ./machost/nng_pair-macos-x64 | grep -q "nng pair ok"
          ./machost/til-macos-x64 interpret examples/hello_script.til | grep -q "Hello World"
          ./machost/til-macos-x64 interpret test/ext_libc.til
      - name: Record the C toolchain
        run: |
          echo "clang: $(clang --version 2>&1 | head -1)"
          echo "ld: $(ld -v 2>&1 | head -1)"
          echo "sdk: $(xcrun --show-sdk-version 2>&1 | head -1)"
      - name: Build and run tests (no gui, ASAN)
        run: |
          make bin/til bin/til_asan bin/test_runner bin/plot bin/tests
          bin/tests --no-gui --til-bin bin/til_asan --asan -j2
      - name: Test target build
        run: |
          ./bin/til build --target=macos-x64 -o bin/hello_script_macos_x64 examples/hello_script.til
          file bin/hello_script_macos_x64 | grep -q "Mach-O"
          ./bin/hello_script_macos_x64
          ./bin/hello_script_macos_x64 | grep -q "Hello World"
      # This host's JNI jar, for jni-jar-merge.
      - name: Build the JNI test jar
        run: ./bin/til build --jni test/jni_lib.til
      - name: Upload the JNI test jar
        uses: actions/upload-artifact@v4
        with:
          name: jni-jar-macos-x64
          path: |
            gen/lib/jni_lib.jar
            gen/til/java/til/jni_lib/JniLib.java
      # Native mac GUI build -- see the macos-arm64 job for the rationale.
      - name: Build native mac examples (gui + portable)
        run: make build_mac
      # Issue #473 (C3): this host's hash list for the collect job.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce macos-x64 tmp/hashes/macos-x64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-macos-x64
          path: tmp/hashes/macos-x64.txt
          if-no-files-found: error
      # See the macos-arm64 job for what the probe and the dump step
      # are for and why they look like this.
      - name: Guard Malloc probe
        if: failure()
        timeout-minutes: 45
        run: |
          if [ -x bin/til ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til translate -c tmp/gm_probe.c test/loops.til || true
          elif [ -x bin/til_boot ]; then
            DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib bin/til_boot translate -c tmp/gm_probe.c test/loops.til || true
          fi
      - name: Dump crash reports
        if: failure()
        run: |
          sleep 30
          ls -l ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          mkdir -p tmp/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          sudo cp /Library/Logs/DiagnosticReports/*.ips tmp/crash/ 2>/dev/null || true
          cp bin/til bin/til_boot tmp/crash/ 2>/dev/null || true
          python3 - <<'EOF'
          import glob, json
          for p in sorted(glob.glob('tmp/crash/*.ips')):
              print('=== digest:', p)
              try:
                  raw = open(p).read()
                  body = json.loads(raw[raw.index('\n'):])
                  for k in ('procName', 'parentProc', 'exception', 'termination', 'asi'):
                      if k in body: print(k, ':', json.dumps(body[k]))
                  t = body['threads'][body.get('faultingThread', 0)]
                  for f in t.get('frames', []):
                      src = f.get('sourceFile', '')
                      line = f.get('sourceLine', '')
                      loc = ' {}:{}'.format(src, line) if src else ''
                      print('  frame img={} off={} {}{}'.format(
                          f.get('imageIndex'), f.get('imageOffset'),
                          f.get('symbol', '?'), loc))
              except Exception as e:
                  print('  digest failed:', e)
          EOF
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-macos-x64
          path: tmp/crash/
          if-no-files-found: ignore
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # One JNI jar for four platforms (doc/ffi.org "One jar for several
  # platforms"): the four native jobs each upload the test/jni_lib.til jar
  # they built, this job merges them with the documented recipe, and
  # jni-jar-run runs JniLibTest against the merged jar on each of the four.
  # The generated Java source must be byte-identical across the hosts: the
  # class names every directory's natives by one runtime ABI.
  jni-jar-merge:
    needs: [linux-x64, linux-arm64-native, macos-arm64, macos-x64]
    name: JNI jar (merge the four hosts' jars)
    runs-on: ubuntu-latest
    steps:
      - name: Download the hosts' JNI jars
        uses: actions/download-artifact@v4
        with:
          pattern: jni-jar-*
          path: hosts
      - name: Merge the jars
        shell: bash
        run: |
          set -eu
          # upload-artifact roots each artifact at its paths' common
          # ancestor, gen/: it holds lib/jni_lib.jar and til/java/...
          targets="linux-x64 linux-arm64 macos-arm64 macos-x64"
          for t in $targets; do
            cmp hosts/jni-jar-linux-x64/til/java/til/jni_lib/JniLib.java \
              "hosts/jni-jar-$t/til/java/til/jni_lib/JniLib.java"
          done
          mkdir merged
          cd merged
          for t in $targets; do "$JAVA_HOME/bin/jar" xf "../hosts/jni-jar-$t/lib/jni_lib.jar"; done
          rm -r META-INF
          "$JAVA_HOME/bin/jar" cf ../jni_lib.jar .
          cd ..
          unzip -Z1 jni_lib.jar | grep '^til/jni_lib/native/'
          [ "$(unzip -Z1 jni_lib.jar | grep -c '^til/jni_lib/native/[^/]*/$')" = 4 ]
          for t in $targets; do
            [ "$(unzip -Z1 jni_lib.jar | grep -c "^til/jni_lib/native/$t/lib")" = 4 ]
          done
      - name: Upload the merged jar
        uses: actions/upload-artifact@v4
        with:
          name: jni-jar-merged
          path: jni_lib.jar
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  jni-jar-run:
    needs: jni-jar-merge
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    name: JNI jar (run the merged jar on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Download the merged jar
        uses: actions/download-artifact@v4
        with:
          name: jni-jar-merged
          path: merged
      # The JDK as test/jni_support.til finds it. No java.library.path: the
      # class loads this runner's natives from the jar.
      - name: Run JniLibTest against the merged jar
        shell: bash
        run: |
          set -eu
          if [ -n "${JAVA_HOME:-}" ]; then jdk=$JAVA_HOME
          elif [ -x /usr/libexec/java_home ]; then jdk=$(/usr/libexec/java_home)
          else jdk=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")"); fi
          mkdir -p tmp/jni_classes
          "$jdk/bin/javac" --release 8 -Xlint:all -Xlint:-options -Werror -cp merged/jni_lib.jar \
            -d tmp/jni_classes test/JniLibTest.java
          "$jdk/bin/java" -Xcheck:jni -cp merged/jni_lib.jar:tmp/jni_classes JniLibTest > tmp/jni_merged.out
          diff test/JniLibTest.expected tmp/jni_merged.out
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #25 phase 2: SDK-less cross-compilation from the canonical
  # linux-x64 host to both mac targets (vendored zig-derived headers +
  # libSystem.tbd + distro clang/lld), with the artifacts executed on
  # the real mac runners -- the same build/run pair shape as
  # windows-x64. Keeping linux-x64 as the single cross host avoids a
  # combinatorial host-x-target explosion in CI.
  macos-cross-build:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos (cross-compile on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang lld llvm cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld.lld llvm-ar dsymutil; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for macos-arm64 and macos-x64
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_script-macos-arm64 examples/hello_script.til
          file bin/hello_script-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/hello_script-macos-x64 examples/hello_script.til
          file bin/hello_script-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      # Issue #472 (F1a): see the linux-arm64 job. Build only.
      - name: Build the layout corpus for macos-arm64 and macos-x64
        run: |
          for arch in arm64 x64; do
            for width in 32 64; do
              ./bin/til build --target=macos-$arch --usize=$width -o bin/layout_corpus-macos-$arch test/layout_corpus.til
            done
          done
      # Issue #235: std/crypto for both mac arches. libsecp256k1 builds
      # from the vendored source against the SDK-less headers (clang +
      # llvm-ar, like the mac gui archives); the binaries run on the mac
      # runners below. Built before the corpus sweep so test/crypto.til
      # links there too.
      - name: Cross-compile the std/crypto test for macos-arm64 and macos-x64
        run: |
          make vendor/secp256k1/build-macos-arm64/lib/libsecp256k1.a vendor/secp256k1/build-macos-x64/lib/libsecp256k1.a
          ./bin/til build --target=macos-arm64 -o bin/crypto-macos-arm64 test/crypto.til
          file bin/crypto-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/crypto-macos-x64 test/crypto.til
          file bin/crypto-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      # Issue #420: libffi for both mac arches, configured out of tree
      # against the same SDK-less headers (and lld + libSystem.tbd for
      # configure's probe links). test/ffi_prep.til calls it directly, and
      # til itself links it for the interpreter's ext_func dispatch; the
      # mac runners below run both, the cross-built til interpreting.
      # Issue #422: nng for both mac arches, SDK-less like the archives above
      # -- til itself links it, and test/nng_pair.til (a one-process round
      # trip over inproc://) runs on the mac runners below.
      - name: Cross-compile libffi programs, the nng test and til for macos-arm64 and macos-x64
        run: |
          make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/libffi/build-macos-x64/.libs/libffi.a
          make vendor/nng/build-macos-arm64/libnng.a vendor/nng/build-macos-x64/libnng.a
          for arch in arm64 x64; do
            ./bin/til build --target=macos-$arch -o bin/ffi_prep-macos-$arch test/ffi_prep.til
            ./bin/til build --target=macos-$arch --extra-modes=examples/custom_modes.til \
              -o bin/nng_pair-macos-$arch test/nng_pair.til
            ./bin/til build --target=macos-$arch -o bin/til-macos-$arch src/til.til
          done
          file bin/ffi_prep-macos-arm64 bin/til-macos-arm64 | grep -c "Mach-O 64-bit arm64" | grep -q 2
          file bin/ffi_prep-macos-x64 bin/til-macos-x64 | grep -c "Mach-O 64-bit x86_64" | grep -q 2
      # Issue #369: put clang over the WHOLE corpus on linux, not just the
      # one example above. Every linux job compiles the generated C with gcc
      # (toolchain_command hardcodes it), so clang first saw the corpus on
      # the two slowest jobs in the run -- and the emitter already carries
      # four workarounds for things clang rejects and gcc accepts in
      # silence, every one of them found as "green linux, red mac". The most
      # recent (e3085558's `Color_TAG_Red == Color_TAG_Red`) passed 356/356
      # here and reddened both mac jobs and nothing else.
      #
      # Going through the DRIVER is the point: it knows each file's flags,
      # which a hand-rolled `for f in gen/til/*.c; clang ...` sweep has to
      # relearn and gets wrong (usize64*.c need --usize=64, bindgen_raylib.c
      # has its own `format` signature).
      #
      # A file counts as failing only when clang emits a warning-as-error
      # -- the `[-W...]` marker. That is exactly the class this exists for,
      # and it deliberately ignores the two other ways a cross build ends:
      # til's own type errors (every test/*_error.til is MEANT to fail the
      # typer, as are the interp-only files) and link failures with no
      # compile diagnostic (ffi_dlopen_fail.til references an undefined
      # symbol on purpose; the gui/nng examples want mac frameworks and
      # native libs that are not vendored here). Keying on the marker needs
      # no skip list, so a new test cannot silently fall out of coverage.
      # Issue #472 (L3a): the suite's reproducible_build row covers the host
      # target; this is the same driver for the two mac targets, whose
      # executables are linked from named objects so that the Mach-O debug
      # map is the same in every build. A program and a library, from two
      # checkout roots and at two times, compared byte for byte.
      - name: Build for macos-arm64 and macos-x64 reproducibly
        run: |
          ./bin/til run test/reproducible_build.til bin/til macos-arm64
          ./bin/til run test/reproducible_build.til bin/til macos-x64
      - name: Cross-compile the corpus for macos-arm64 (clang -Werror)
        run: |
          status=0
          for f in test/*.til examples/*.til; do
            log=$(./bin/til build --target=macos-arm64 -o tmp/xcheck "$f" 2>&1 || true)
            # Issue #472 (F1a): a failed layout assert is not a warning and
            # carries no `[-W` marker, but it is exactly as much the
            # compiler's verdict on the emitted C.
            if printf '%s' "$log" | grep -q -e '\[-W' -e 'static assertion failed'; then
              echo "=== $f"
              printf '%s\n' "$log" | grep -e '\[-W' -e 'static assertion failed' | head -5
              status=1
            fi
          done
          exit $status
      # Issue #472 (level 3) / #473 (C7): what this host builds for the two
      # mac targets, with the identity of the clang, lld, llvm-ar and
      # dsymutil that built it. The collect job compares these binaries
      # between producers only where the toolchains are the same (the
      # toolchain rule, end of issues/open/472.org) and says so where they
      # are not. The mac headers and libraries are the repository's
      # vendor/macos on every host.
      - name: Write the binary hash lists for the collector
        run: |
          mkdir -p tmp/hashes-binary
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-x64 tmp/hashes-binary/linux-x64.txt bin/til macos-arm64 macos-x64
      - name: Upload the binary hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-linux-x64
          path: tmp/hashes-binary/linux-x64.txt
          if-no-files-found: error
      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_script-macos
          path: |
            bin/hello_script-macos-arm64
            bin/hello_script-macos-x64
            bin/crypto-macos-arm64
            bin/crypto-macos-x64
      # Its own artifact, downloaded into machost/ like the windows-host
      # run job's winhost/: til finds its source tree in its directory's
      # parent, so from there it uses the checkout's.
      - name: Upload the mac til and libffi programs
        uses: actions/upload-artifact@v4
        with:
          name: til-macos-cross
          path: |
            bin/ffi_prep-macos-arm64
            bin/ffi_prep-macos-x64
            bin/nng_pair-macos-arm64
            bin/nng_pair-macos-x64
            bin/til-macos-arm64
            bin/til-macos-x64
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  macos-host-cross-win-run:
    name: macos host cross (run .exe on windows)
    needs: macos-arm64
    runs-on: windows-latest
    steps:
      - name: Download cross artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello_script-from-mac
      - name: Run mac-built .exe
        shell: bash
        run: |
          ./hello_script-from-mac.exe
          ./hello_script-from-mac.exe | grep -q "Hello World"
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  macos-host-cross-linux-run:
    name: macos host cross (run ELF on linux)
    needs: macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download cross artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello_script-from-mac
      - name: Run mac-built ELF
        run: |
          chmod +x hello_script-from-mac-linux
          ./hello_script-from-mac-linux
          ./hello_script-from-mac-linux | grep -q "Hello World"
      - name: Run the mac-built std/crypto test
        run: |
          chmod +x crypto-from-mac-linux
          ./crypto-from-mac-linux
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #25 phase 3 / #232: mac GUI cross from Linux end to end, with NO
  # mac and NO Apple SDK. raylib's RGFW desktop backend drives Cocoa through
  # the objc runtime (objc_msgSend), so it cross-compiles against the
  # SDK-less framework-type shims (vendor/macos/frameworks-shim); the
  # build_mac_raylib steps in make.til build the per-arch archives on linux
  # and examples/gen_framework_stubs.til --linux-map emits the .tbd link stubs from
  # their external symbols (the real Cocoa/OpenGL/... dylibs bind at runtime
  # on the target mac, exactly like the vendored libSystem.tbd). This job
  # builds the whole chain on linux and asserts a valid Mach-O per arch --
  # the mac analogue of the mingw-cross windows gui, no prebuilt binaries.
  macos-gui-cross:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: macos gui (cross-compile on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang lld llvm
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld.lld llvm-ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      # The one job that drives the build program DIRECTLY (issue #345):
      # everywhere else `make <goals>` builds bin/make and hands the
      # goals over, so this is what proves the direct interface -- the
      # same multi-goal artifact request, one invocation, no Make.
      - name: Build mac raylib + tinyfd + framework stubs on linux (no SDK)
        run: |
          make bin/make
          ./bin/make vendor/macos/frameworks/.stamp vendor/tinyfiledialogs/build-macos-arm64/libtinyfd.a vendor/tinyfiledialogs/build-macos-x64/libtinyfd.a
      - name: Cross-compile a mode-gui example for both mac arches
        run: |
          ./bin/til build --target=macos-arm64 -o bin/hello_gui-macos-arm64 examples/hello_gui.til
          file bin/hello_gui-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/hello_gui-macos-x64 examples/hello_gui.til
          file bin/hello_gui-macos-x64 | grep -q "Mach-O 64-bit x86_64"
          # #83: same editor.til coverage as the windows gui cross job.
          ./bin/til build --target=macos-arm64 -o bin/editor-macos-arm64 examples/editor.til
          file bin/editor-macos-arm64 | grep -q "Mach-O 64-bit arm64"
          ./bin/til build --target=macos-x64 -o bin/editor-macos-x64 examples/editor.til
          file bin/editor-macos-x64 | grep -q "Mach-O 64-bit x86_64"
      - name: Upload mac gui artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_gui-macos
          path: |
            bin/hello_gui-macos-arm64
            bin/hello_gui-macos-x64
      - name: Cancel the rest of this run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  # Issue #473 (C3): one place that says what every producer delivered and
  # whether their outputs agree. It runs whatever the producers' results
  # were, prints each one, and compares the hash lists they uploaded with
  # examples/ci_collect.til. A producer that did not succeed, or whose list
  # is not there, fails this job. So does any difference between producers,
  # or an item one of them left out: run 3085 had all five producers agree on
  # every item (870 frontend observations, 270 translated files), and #472
  # holds levels 1 and 2 to that from here on. It still runs after another
  # job cancelled the run (run 3067): the producers were cancelled, no list
  # arrived, and it failed saying so.
  collect:
    name: collect (compare the producers' hash lists)
    needs: [doc-gate, linux-x64, linux-arm64-native, windows-x64-host-run, macos-arm64, macos-x64, macos-cross-build]
    if: always() && needs.doc-gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Producer results
        env:
          LINUX_X64: ${{ needs.linux-x64.result }}
          LINUX_ARM64: ${{ needs.linux-arm64-native.result }}
          WINDOWS_X64: ${{ needs.windows-x64-host-run.result }}
          MACOS_ARM64: ${{ needs.macos-arm64.result }}
          MACOS_X64: ${{ needs.macos-x64.result }}
          MACOS_CROSS: ${{ needs.macos-cross-build.result }}
        run: |
          status=0
          for pair in "linux-x64=$LINUX_X64" "linux-arm64-native=$LINUX_ARM64" \
            "windows-x64-host-run=$WINDOWS_X64" "macos-arm64=$MACOS_ARM64" "macos-x64=$MACOS_X64" \
            "macos-cross-build=$MACOS_CROSS"; do
            echo "$pair"
            if [ "${pair#*=}" != success ]; then status=1; fi
          done
          exit $status
      - name: Download the producers' hash lists
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
      - name: Create test tmp directory
        if: always()
        run: mkdir -p tmp hashes
      - name: Build bin/til
        if: always()
        run: make
      - name: Compare the hash lists
        if: always()
        run: |
          find hashes -type f | sort
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til collect hashes
