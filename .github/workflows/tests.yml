name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs on any branch: lets bot sessions iterate on
  # platform-specific jobs (issue #25 macos bring-up) from a feature
  # branch instead of burning a master merge per attempt.
  workflow_dispatch:

# Runs of one branch go one at a time, and a run that has started always
# finishes (Jorge, #473, 2026-11-16). While one runs, the newest push waits
# and replaces whichever push was waiting before it; that older one is
# cancelled without having started, and its changes are tested as part of
# the newer run. Without this every push started a full run of its own:
# about two hours, most of the account's runners, and seven of them queued
# behind each other on 2026-11-16.
# This is NOT the rule removed on 2026-11-15, which cancelled the run in
# progress, so that with frequent merges no run ever finished:
# cancel-in-progress stays false.
# A push whose head commit is "Doc: " gets a group of its own: its run
# skips every job (doc-gate), and must neither wait behind a code run nor
# replace the code push that is waiting.
concurrency:
  group: "tests-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'Doc: ') && github.sha || 'code' }}"
  cancel-in-progress: false

# A failing job does not cancel the run (Jorge, 2026-11-17). Every job used
# to end with a step that cancelled the whole run when one of its steps had
# failed, so that a failing commit stopped holding runners; GitHub then
# reports the run as cancelled (a grey mark in the list of runs), and the
# failing job as cancelled too, where a failed run is red. Now the other
# jobs run to their end: a failing run is red, shows every independent
# failure at once, and holds the runners and the queue above for as long
# as a passing one.
permissions:
  contents: read

jobs:
  # A push whose commits are all documentation-only ("Doc: " subject,
  # CLAUDE.md "Commits") runs nothing else: every other root job needs
  # this one, and jobs downstream of a skipped job are skipped too. Pull
  # requests, manual runs and pushes with any non-Doc commit run the full
  # workflow. github.event.commits is empty for some pushes (a branch
  # creation, a push of more than 2048 commits); those run everything.
  doc-gate:
    name: 'Skip CI when every pushed commit is "Doc: "'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ "$EVENT" != push ]; then
            code=true
          else
            printf '%s\n' "$COMMITS" | jq -r '.[] | .message | split("\n")[0]'
            code=$(printf '%s' "$COMMITS" | jq -r 'if length == 0 then "true" elif all(.[]; .message | startswith("Doc: ")) then "false" else "true" end')
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # GL/X11 headers are vendored (#59, #92); GUI execution needs only
  # runtime libraries, Mesa and Xvfb, not graphics development packages.
  templeos:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: TempleOS guest (QEMU TCG, USize 32/64)
    runs-on: ubuntu-latest
    # Language/collection/test-mode cases share boots in private guest tasks
    # at both widths (#151). Filesystem, GUI and hard-timeout cases retain
    # fresh VMs, about 44s each. The old per-program boots exceeded 60 minutes;
    # batching removes 40 boots, including 20 minutes of fixed startup sleeps.
    # A hung guest is caught by expect's 180s deadline, not by this budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Run native guest acceptance
        run: make test_templeos
      - name: Upload guest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: templeos-diagnostics
          path: |
            tmp/templeos/*.log
            tmp/templeos/*.HC
            tmp/templeos/*.ppm

  linux-x64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      # Issue #472 (L3b) / #473 (C4): which C compiler, linker and archiver
      # this runner really has. Comparing binaries between producers means
      # one pinned toolchain per target, and the first step is knowing what
      # each job uses today. Printed in every job that compiles C.
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run tests
        run: make test_asan
      - name: Test target build
        run: |
          ./bin/til build --target=linux-x64 -o bin/hello_script_x64 examples/hello_script.til
          file bin/hello_script_x64 | grep -q "x86-64"
          ./bin/hello_script_x64
      # Issue #473 (C5, C6) / #472 (levels 1 and 2 across hosts): what this
      # host's compiler makes of the corpus, as a list of hashes -- the
      # state at each phase boundary for one target, and the source every
      # target translates to. The collect job compares the lists of all
      # producers. About two minutes.
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce linux-x64 tmp/hashes/linux-x64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-linux-x64
          path: tmp/hashes/linux-x64.txt
          if-no-files-found: error
      # Issue #504: the suite again with this host's target pinned -- the
      # pinned LLVM (make.til LLVM_RELEASE, cached per release and runner
      # kind) and the Bootlin C library under vendor/linux -- so bin/til,
      # bin/til_asan and every program the suite builds are what any host
      # builds for linux-x64. On trial: once a run shows it passing, this
      # is the job's one suite, from its start. The bin/til hash printed
      # last is the one to find in the collect job as linux-x64's
      # "make bin/til" (listed by the windows-x64-build job, the other
      # Linux x64 runner, and cross-built by the arm64 one).
      - name: The pinned LLVM release
        id: llvm
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_RELEASE := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned LLVM
        uses: actions/cache@v4
        with:
          path: vendor/llvm
          key: llvm-${{ steps.llvm.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Suite with the pinned C library
        continue-on-error: true
        timeout-minutes: 120
        run: |
          make llvm
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version | grep -q "clang version 23.1.5"
          ./bin/make vendor/linux/linux-x64
          make test_asan
          sha256sum bin/til

  android-runtime:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: Android x86_64 runtime (API ${{ matrix.api }}, ${{ matrix.pages }}-byte pages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            image: google_apis
            pages: 4096
          # The API 35 16 KB guest crashed in ART's nterp inside system_server
          # (run 3195 and local ActivityManager relaunches). Keep 16 KB on API 36.
          - api: 36
            image: google_apis_ps16k
            pages: 16384
            # Run 3200: lmkd killed the cached Checkers process between Back
            # and relaunch with the Pixel 2 profile's default 2 GiB.
            ram: 4096M
    steps:
      - uses: actions/checkout@v5
      - name: Build the host compiler and smoke driver
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1
          mkdir -p tmp/android-smoke-home tmp/android_smoke
          make
          bin/til build test/android_smoke.til
      - name: Install APK tools and enable KVM
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run CLI, ART JNI and Checkers at both USize layouts
        # v2.37 creates 16 KB AVDs by package without forcing a mismatched --abi tag.
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          # The action puts AVDs below $HOME/.android/avd.
          HOME: ${{ github.workspace }}/tmp/android-smoke-home
          ANDROID_USER_HOME: ${{ github.workspace }}/tmp/android-smoke-home/.android
          TMPDIR: ${{ github.workspace }}/tmp
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          profile: pixel_2
          ram-size: ${{ matrix.ram }}
          avd-name: til-smoke
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: >-
            status=0;
            bin/test/android_smoke "$ANDROID_SERIAL" ${{ matrix.api }} ${{ matrix.pages }} > tmp/android_smoke/crash.log 2>&1 || status=$?;
            cat tmp/android_smoke/crash.log;
            if [ "$status" -ne 0 ]; then
            timeout 30s adb -s "$ANDROID_SERIAL" exec-out run-as org.til.androidsmoke cat files/actual.txt >> tmp/android_smoke/crash.log 2>&1;
            timeout 30s adb -s "$ANDROID_SERIAL" logcat -d -b crash >> tmp/android_smoke/crash.log 2>&1;
            timeout 30s adb -s "$ANDROID_SERIAL" logcat -d -b all -t 3000 >> tmp/android_smoke/crash.log 2>&1;
            fi;
            exit "$status"
      - name: Remove disposable AVD and debug key
        if: always()
        run: rm -rf tmp/android-smoke-home
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-api-${{ matrix.api }}
          path: |
            tmp/android_smoke/**/*.log
            tmp/android_smoke/**/*.actual
            tmp/android_smoke/**/*.png

  # One layout flag (doc/self.org): --usize=32, the compact layout (U32
  # widths, own pointers in the #313 cage), is the default on 64-bit C
  # targets, so every other job runs on it. This job keeps the native
  # layout alive: make check_usize64 runs the --usize=64 regressions, then
  # the whole suite through a compiler built --usize=64 (under ASAN), with
  # every program built --usize=64 too.
  linux-x64-usize64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-x64 (--usize=64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Suite through the native-layout compiler
        run: make check_usize64

  # Issue #25: aarch64-linux as a native HOST (GitHub's free arm64
  # runners), running the full suite. Blocking like every other linux
  # job: its bring-up failures (plain-char signedness) were fixed by
  # the -fsigned-char contract and the suite is green here.
  linux-arm64-native:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-arm64 (native)
    runs-on: ubuntu-24.04-arm
    # GCC 13's libasan turns detect_stack_use_after_return on by default,
    # and its fake-stack frames are pathologically slow on this aarch64
    # runner: a hello_script translate by bin/til_asan takes 77s of pure
    # user CPU (0.5s without ASAN, 3.5s under ASAN on linux-x64) and 1.2s
    # with the fake stack off -- the same 1.2s as building the compiler
    # with --param asan-use-after-return=0, while every other ASAN switch
    # (stack redzones, use-after-scope, out-of-line checks, globals,
    # unwinder, quarantine, leak check) leaves it at 65-82s. That 60x
    # made the suite take 6h here, GitHub's per-job limit (runs 2723-2735
    # cancelled). Only this job opts out; the x64 suite keeps the check.
    env:
      ASAN_OPTIONS: detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri clang
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in aarch64-linux-gnu-gcc gcc clang ld ar; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build and run tests
        run: make test_asan
      - name: Test target build
        run: |
          ./bin/til build --target=linux-arm64 -o bin/hello_script_arm64_native examples/hello_script.til
          file bin/hello_script_arm64_native | grep -q "aarch64"
          ./bin/hello_script_arm64_native
          ./bin/hello_script_arm64_native | grep -q "Hello World"
      - name: Write the hash lists for the collector
        run: |
          mkdir -p tmp/hashes
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce linux-arm64 tmp/hashes/linux-arm64.txt bin/til
      - name: Upload the hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-linux-arm64
          path: tmp/hashes/linux-arm64.txt
          if-no-files-found: error
      # Issue #472: windows-x64 with the one compiler every host uses for it,
      # llvm-mingw (clang, lld and the mingw-w64 UCRT runtime) at one pinned
      # release, which is published for Linux x64 and arm64, macOS and
      # Windows hosts. Its bin directory goes first on PATH: it carries the
      # x86_64-w64-mingw32-gcc, -ar, -windres and -dlltool names til and
      # bin/make already run, as clang and the llvm tools. Every windows
      # build in this workflow uses it (issue #483). Strict since CI runs
      # 3159 to 3166 showed the three hosts' til.exe equal, the Windows
      # host's tested bin/til.exe included: a difference fails collect.
      # The pinned llvm-mingw (make.til LLVM_MINGW_RELEASE and _LAYOUT), unpacked by
      # `make llvm_mingw` into vendor/llvm-mingw, kept between runs: one
      # cache entry per release and runner kind.
      - name: The pinned llvm-mingw release
        id: llvm-mingw
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_MINGW_RELEASE := "\(.*\)"$/\1/p' make.til)
          layout=$(sed -n 's/^LLVM_MINGW_LAYOUT := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          test -n "$layout"
          echo "release=$release-$layout" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned llvm-mingw
        uses: actions/cache@v4
        with:
          path: vendor/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Write the windows binary hash list with the pinned llvm-mingw
        run: |
          make llvm_mingw
          export PATH="$PWD/vendor/llvm-mingw/bin:$PATH"
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc --version | grep -q clang
          rm -rf vendor/libffi/build-windows-x64 vendor/nng/build-windows-x64
          make vendor/libffi/build-windows-x64/.libs/libffi.a vendor/nng/build-windows-x64/libnng.a
          # Run 3130: til.exe's code was the same from all three hosts, but
          # every C object of libffi and nng differed between each pair of
          # them. One small object in full, to read what differs from the
          # three logs.
          mkdir -p tmp/probe
          (cd tmp/probe && x86_64-w64-mingw32-ar x ../../vendor/libffi/build-windows-x64/.libs/libffi.a types.o)
          x86_64-w64-mingw32-objdump -h -t -s tmp/probe/types.o
          mkdir -p tmp/hashes-binary-windows
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-arm64 tmp/hashes-binary-windows/linux-arm64.txt bin/til windows-x64
          # Run 3138: the two Linux hosts write the same til.exe and the
          # Windows host another one, with the same vendored objects. til's
          # lines by section, and the strings in the two debug sections that
          # differ (run 3138: .debug_info and .debug_line), to read from the
          # three logs what differs.
          grep "src/til.til til" tmp/hashes-binary-windows/linux-arm64.txt
          x86_64-w64-mingw32-objcopy --dump-section .debug_line=tmp/probe/debug_line --dump-section .debug_info=tmp/probe/debug_info tmp/ci_collect/binary_windows-x64/til.exe tmp/probe/til_copy.exe
          x86_64-w64-mingw32-strings -a tmp/probe/debug_line | grep -E '[/\\]|\.[ch]$' | sort -u | head -80
          x86_64-w64-mingw32-strings -a tmp/probe/debug_info | grep -E '[/\\]|\.[ch]$' | sort -u | head -20
      - name: Upload the windows binary hash list
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-windows-linux-arm64
          path: tmp/hashes-binary-windows/linux-arm64.txt
      # Issue #472: the mac targets with the one compiler every host uses
      # for them, LLVM's own release (clang, lld, dsymutil, the llvm tools)
      # at one pinned version, published for Linux x64 and arm64 and macOS
      # arm64 hosts. `make llvm` downloads it, checks its sha256 and unpacks
      # only the tools til and bin/make run; they go first on PATH. Headers and libSystem are vendor/macos, as
      # before. Mac equality remains on trial; Android producer failures are
      # blocking after run 3167. The mac binaries the Macs RUN are built by
      # macos-cross-build with Ubuntu's clang.
      # The pinned LLVM (make.til LLVM_RELEASE), unpacked by `make llvm` into
      # vendor/llvm, kept between runs: one cache entry per release and
      # runner kind.
      - name: The pinned LLVM release
        id: llvm
        shell: bash
        run: |
          release=$(sed -n 's/^LLVM_RELEASE := "\(.*\)"$/\1/p' make.til)
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned LLVM
        uses: actions/cache@v4
        with:
          path: vendor/llvm
          key: llvm-${{ steps.llvm.outputs.release }}-${{ runner.os }}-${{ runner.arch }}
      - name: Write the mac and Android binary hash lists with the pinned LLVM
        run: |
          make llvm
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version
          clang --version | grep -q "clang version 23.1.5"
          ld64.lld --version
          rm -rf vendor/libffi/build-macos-arm64 vendor/libffi/build-macos-x64 vendor/nng/build-macos-arm64 vendor/nng/build-macos-x64
          make vendor/libffi/build-macos-arm64/.libs/libffi.a vendor/libffi/build-macos-x64/.libs/libffi.a
          make vendor/nng/build-macos-arm64/libnng.a vendor/nng/build-macos-x64/libnng.a
          make vendor/raylib/build-android-x64/libraylib.a vendor/raylib/build-android-arm64/libraylib.a
          ./bin/til run test/reproducible_build.til bin/til android-x64
          ./bin/til run test/reproducible_build.til bin/til android-arm64
          mkdir -p tmp/hashes-binary-mac
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-arm64 tmp/hashes-binary-mac/linux-arm64.txt bin/til macos-arm64 macos-x64 android-x64 android-arm64
      - name: Upload the mac binary hash lists
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-mac-linux-arm64
          path: tmp/hashes-binary-mac/linux-arm64.txt
          if-no-files-found: error
      # Issue #504: the six Linux targets with their pinned C library --
      # Bootlin's toolchain for each, glibc 2.34, unpacked by bin/make under
      # vendor/linux -- and the pinned LLVM that is first on PATH here. til
      # builds a linux target with clang, lld and that tree wherever it is
      # unpacked, and bin/make builds the target's archives the same way,
      # this host's own included. So this host's own bin/til is built again
      # here, against the tree (bin/make vendor swaps the host's archives,
      # bin/til depends on them): the list's "make bin/til" for this host's
      # target is then that file, to compare with the other host's cross
      # build of it. Run 3199: the two hosts' linux-x64 and linux-arm64
      # lists were equal but for that item, each host's own gcc build then.
      # The 32-bit targets list no til: til is not a 32-bit program. On
      # trial and continue-on-error.
      - name: Write the linux binary hash lists with the pinned C library
        continue-on-error: true
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          clang --version | grep -q "clang version 23.1.5"
          ./bin/make linux_sysroots
          ./bin/make vendor
          ./bin/make bin/til
          sha256sum bin/til
          for target in linux-x64 linux-arm64 linux-arm32 linux-riscv64 linux-x86 linux-riscv32; do
            ./bin/make vendor/libffi/build-$target/.libs/libffi.a vendor/nng/build-$target/libnng.a
            ./bin/til run test/reproducible_build.til bin/til $target
          done
          mkdir -p tmp/hashes-binary
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary linux-arm64 tmp/hashes-binary/linux-arm64.txt bin/til linux-x64 linux-arm64 linux-arm32 linux-riscv64 linux-x86 linux-riscv32
      - name: Upload the linux binary hash lists
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-linux-arm64
          path: tmp/hashes-binary/linux-arm64.txt
      # Issue #504: the suite again, on the bin/til just listed and with
      # everything it builds against the pinned C library (bin/til_asan by
      # the pinned clang, with clang's sanitizer runtime). On trial: once a
      # run shows it passing, this is the job's one suite, from its start.
      # make builds bin/til again; the same bytes, or the last line fails.
      - name: Suite with the pinned C library
        continue-on-error: true
        timeout-minutes: 150
        run: |
          export PATH="$PWD/vendor/llvm/bin:$PATH"
          sha256sum bin/til > tmp/til-pinned.txt
          cat tmp/til-pinned.txt
          make test_asan
          sha256sum -c tmp/til-pinned.txt
      # Issue #473: wasm32 from this host too (see the wasm32 job). The
      # emsdk is installed with the first wasm32 archive bin/make builds.
      - name: Write the wasm32 binary hash list
        if: false
        continue-on-error: true
        run: |
          ./bin/make vendor/secp256k1/build-wasm32/lib/libsecp256k1.a
          mkdir -p tmp/hashes-binary-wasm
          ./bin/til run -o bin/c/ci_collect -c gen/c/ci_collect.c examples/ci_collect.til produce-binary-trial linux-arm64 tmp/hashes-binary-wasm/linux-arm64.txt bin/til wasm32
          cat tmp/hashes-binary-wasm/linux-arm64.txt
      - name: Upload the wasm32 binary hash list
        if: false
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hashes-binary-wasm-linux-arm64
          path: tmp/hashes-binary-wasm/linux-arm64.txt

  linux-arm64:
    needs: doc-gate
    if: needs.doc-gate.outputs.code == 'true'
    name: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 xvfb libgl1-mesa-dri gcc-aarch64-linux-gnu qemu-user cmake
      - name: Create test tmp directory
        run: mkdir -p tmp
      - name: Record the C toolchain
        run: |
          for tool in gcc aarch64-linux-gnu-gcc aarch64-linux-gnu-ld; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: not installed"
            fi
          done
      - name: Build bin/til (native)
        run: make
      - name: Cross-compile for linux-arm64
        run: |
          ./bin/til build --target=linux-arm64 -o bin/hello_script_arm64 examples/hello_script.til
          file bin/hello_script_arm64 | grep -q "aarch64"
      # Issue #472 (F1a): every C build carries one static assert per emitted
      # type that the C compiler's sizeof equals the layout til computed for
      # this target, so compiling is the check. test/layout_corpus.til holds
      # the awkward shapes (64-bit scalars after a byte, width aliases, own
      # fields, enum payloads) and is built here at both USize widths.
      - name: Build and run the layout corpus for linux-arm64
        run: |
          for width in 32 64; do
            ./bin/til build --target=linux-arm64 --usize=$width -o bin/layout_corpus_arm64 test/layout_corpus.til
            qemu-aarch64 -L /usr/aarch64-linux-gnu bin/layout_corpus_arm64 | grep -q "layout corpus OK"
          done
      # Issue #235: std/crypto cross-built for this target. libsecp256k1
      # builds from the vendored source into this target's own archive
      # (the builder links it instead of the host's), and test/crypto.til
      # -- the FIPS 180-4 SHA-256 and BIP-340 vectors -- runs under qemu.
      - name: Cross-compile and run the std/crypto test for linux-arm64
        run: |
          make vendor/secp256k1/build-linux-arm64/lib/libsecp256k1.a
          ./bin/til build --target=linux-arm64 -o bin/crypto_arm64 test/crypto.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/crypto_arm64
      # Issue #422: nng for this target, from make.til's per-target table
      # (vendor/nng/build-linux-arm64), which the server modes' link() lines
      # name; test/nng_pair.til -- a one-process round trip over inproc://
      # -- runs under qemu. Before the libffi step: til itself links nng.
      - name: Cross-compile and run the nng test for linux-arm64
        run: |
          make vendor/nng/build-linux-arm64/libnng.a
          ./bin/til build --target=linux-arm64 --extra-modes=examples/custom_modes.til \
            -o bin/nng_pair_linux-arm64 test/nng_pair.til
          qemu-aarch64 -L /usr/aarch64-linux-gnu bin/nng_pair_linux-arm64 | grep -q "nng pair ok"
      # Issue #420: libffi for this target, built out of tree into
      # vendor/libffi/build-linux-arm64. test/ffi_prep.til calls it directly;
      # til itself, cross-built, links it for the interpreter's ext_func
      # dispatch, so til can interpret programs ON this host.
      - name: Cross-compile and run libffi programs for linux-arm64
